        \ / 31.80° (AR0234CS 16:10)**, 不是 40.45°。\n★ **撤回我那句\"两种俯角都安全\"** —— 走鱼眼路线时俯角 32° 仍会掉出画面。\n★ **修正后的工作基线**:\
        \ **鱼眼 (等距/等立体角) + 对角 120° + 俯角 ≤25° (OV04C10) / ≤28° (AR0234CS 16:10)**\n  · 畸变代价 (老板已接受, 不构成否决):\
        \ 角落桶形 -39.5% / 水平边 -29.4% / 垂直边 -9.0%\n  · **反向收益**: 不做 LDC → ISP 省掉畸变校正重采样 (缓解 §5.7.1 LDC 占\
        \ pipeline 预算); 鱼眼角分辨率均匀 (0.0389°/px), 直行 120° 角落比中心粗 4.0 倍 → 对边缘目标检测鱼眼反而更好\n  · 为什么必须走鱼眼: 直行\
        \ 120° 在 1/3\" 靶面要 f=1.78mm、等效光圈缩到 ⌀0.6-0.7mm (f/2.6-3.0) → 弱光信噪比不可接受\n  · ★ **投影模型必须和 FOV 数字一起写进\

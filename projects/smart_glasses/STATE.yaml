        1.2V + VDD_IO 1.8/2.8V; Note 19 并轨表; Table 22/23 上电断电时序)。★★顺带查出 4 个投板后必改的问题: ①I2C 地址写错 0x36 应为
        0x10 (datasheet p.11 写明默认 0x20/0x21 即 7-bit 0x10, 拉高 SADDR 选 0x30/0x31 即 0x18) ②I2C 上拉 3.3V 超
        VIN 绝对最大额定值 ③网表缺 VDDIO_PHY 1.8V 轨且 CONN_CAM 18p 已 18/18 占满加不出第 4 条轨 (三方案 A 20p连接器/B 铰链侧本地LDO/C

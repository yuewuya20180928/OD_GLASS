        (Table 14 p.17: VSUPPLY All Supplies 4.5V, 但 VIN DC Input Voltage = VDD_IO+0.3 = 3.1V => 3.3V
        I2C 上拉超绝对最大额定值 0.2V, 改上拉 2.8V, 0 颗新器件, 只改 R_PU_I2CA 顶网到 RAIL_SENSOR_VDD_IO)。U3 部分查到 (Table 1 p.1:
        CRA = 0 度或 28 度, 是两个 PN 变体不是同一料两档; Figure 19 p.23 给 28 度变体完整 CRA-vs-像高表, 角落 27.97 度 @ 3.396mm

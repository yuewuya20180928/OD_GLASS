risks:
- id: R-dsi-unknown
  text: ARS45 显示 TX 接口未确认 (媒体二手证据) — 若既无 DSI TX 也无 DP TX, 则显示链不成立
  severity: high
  owner: main
- id: R-R16-e2e
  text: RK3572 4 TOPS ⇒ 纯 NPU [推算] 23.1~26.1ms ⇒ 模式A 62.7~65.7ms ⇒ 超老板锁死的 60ms 硬指标; 且 RK3576 上的 RKNN 实测链
    (NPU 15.4~17.4ms) 不可移植 ⇒ 必须板端重测 (ISS-129)
  severity: high
  owner: main
- id: R-R17-thermal
  text: RK3572 原厂口径 670mW @1080P 播放 vs 贴皮肤可持续上限 0.15-0.2W ⇒ 超 3.4~4.5 倍 ⇒ 43°C 红线大概率违反; 且眼镜腔体无主动散热 ⇒ 满载降频会反噬
    60ms 判定 ⇒ 两个硬指标必须同一次测量里一起判 (ISS-130)
  severity: high
  owner: main
- id: R-hw-display-chain
  text: 若既无 DSI TX 也无 DP TX, 则不是加颗桥芯片的事, 而是显示链不成立
  severity: high
  owner: hw-lead
- id: R-hw-pitch
  text: FCCSP pitch ≤0.3mm → 须 HDI → 违反 4-6 层锁死 → SoC 选型一票否决
  severity: high
  owner: hw-lead
- id: R-hw-boot-storage
  text: 若无内置 boot storage → 需外挂 SPI-NOR/eMMC (吃 PCB 面积, 板宽 12→15mm), 投板前必须 close
  severity: high
  owner: hw-lead
- id: R-hw-netlist-chain
  text: '★ISS-153 交卷时实测: HW/netlist_v1.csv 在 11-04 03:01 加了 A2 段(SoM 4x100pin 座 + demo 板载 Type-C + F13
    门控), 但 HW/netlist_v1.net 还停在 11-03 00:50 ⇒ 导出链没重跑 ⇒ gen_netlist_pins.py / check_kicad_net.py 长期 rc=1
    ⇒ **HW/netlist_v1_pins.csv 出不来, PCB 工程师手上还是旧版脚级表 (TMP117 4 脚 / 挂 I2C_A)**。★具体 5 条阻塞见 HANDOFF/2026-11-04_hw-lead_ISS153.md
    §6 (其中 B-1: J_SOM_P2+J_SOM_P4 共 23 个 SoM 脚整条从 .net 消失 ⇒ KiCad 导入即悬空; B-2: USB D+ 串阻/ESD 双失效)。★根因:
    改了网表内容没同步跑生成链 ⇒ 建议加一条"改了 gen_netlist.py 必须重跑 gen_kicad_net → gen_netlist_pins"的门禁'
  severity: high
  owner: hw-lead
- id: R-sw-step
  text: 'NPU 延迟台阶效应: 纯 NPU 跨过 16.67ms 边界 → age 从 2 跳 3 → 端到端直接多一整个帧周期 (67→83.7ms)。差 2ms 可能等于差 17ms'
  severity: high
  owner: sw-lead
- id: R-sw-fp32
  text: NPU 强制 FP32 输出 → 反量化占 SDK 总 25% (A733 实测 9.29ms) → 框龄跳档
  severity: high
  owner: sw-lead
- id: R-mech-heat
  text: 持续满载 1.22W 与'眼镜贴皮肤佩戴'热学上不相容 (差 6-8 倍)。出路是降功耗不是加散热片
  severity: high
  owner: mech-lead
- id: R-mech-thickness
  text: '电池容量直接决定镜腿厚度: 340→7.3mm / 575→8.7mm / 675→11.2mm (华为 6.25mm 的 1.8 倍, 形态否决)'
  severity: high
  owner: mech-lead
- id: R-mech-splitter
  text: 'R13 分光件自研: 必须与光机共基准 (0.25°→40mm 臂长 0.175mm), 分光面需 ≤5µm 而 FDM 是 Ra 10-30µm → Plan B 双光机在结构上比一拖二更简单'
  severity: high
  owner: mech-lead
- id: R-R15-bypass
  text: '星型拓扑残余绕过通道: 绝对路径调真实 openclaw 二进制仍可横向投递 (工具层 deny + PATH shim 已双保险封死)'
  severity: medium
  owner: main
- id: R-mech-chargeboard
  text: 充电板只 0.2cc 但吃 25mm 长度, 是镜脚长度超标唯一元凶 → 必须挪出镜脚
  severity: medium
  owner: mech-lead
- id: R-mech-service-port-tip-v
  text: 镜脚末端外侧面 V 净高未定义 [0数据] (镜腿是上宽下窄锥形) => 开口 4.60 + 两侧 1.25 = 需要 7.10mm; 若不满足只能开口往根部挪或启备选 SP-C (下方开孔)
  severity: medium
  owner: mech-lead
- id: R-mech-service-port-magnet
  text: 检修口磁吸用 N35 钕铁硼, 对 MEMS 麦克风的磁场影响未验 [0数据] (麦克风磁场敏感度项目里没有); 间距 >=40mm 大概率无碍, 但磁铁牌号应选低矫顽力或改弹性卡扣
  severity: medium
  owner: mech-lead
- id: R-mech-service-port-coplanarity
  text: 产线 pogo 压 10 针焊盘的共面度 <=0.05mm 依赖 PIN-SET-2 定位链 (重复性 0.046mm); 若骨架/PCB 装配超差会出现 1-2 针压不到 => 选自浮动
    pogo + 夹具加 0.05mm 通止规自检
  severity: medium
  owner: mech-lead
- id: R-mech-service-port-seam
  text: 磁吸+自攻螺钉若**无密封条**, 搭边缝/螺钉孔/磁铁缝全是水路 => **IPx4 不成立** (只能宣称防汗); 量产必须加 PORON 0.50x1.50 密封条 + 0.50mm
    迷宫搭边, 且 IPx5/x7 浸水仍不可达
  severity: low
  owner: mech-lead

      value: '结构侧本轮新增硬约束 (会限制你的 DVFS 散热方案): 镜脚前后厚余量只有 0.30mm → 导热垫 (0.3mm) 与金属骨架 (厚度 v1.1 未给, 我按 1.0mm
        假设) 都加不厚; 若你要求更厚的骨架/更多散热面积来压结温, 必须同步把镜腿前后厚从 7.3 加到 7.6-7.8mm (华为 6.25 基准会进一步被突破, 需老板拍板形态)。另外:
        持续满载 1.22W → 皮肤侧推算 96.1/82.0°C, 43°C 红线只允许贴皮肤镜腿持续 0.16-0.21W, 这个数字没变, 降温只能靠降功耗不能靠加散热片'
      ref: MECH/fit_check.py + MECH/MECH_BUDGET.md#2.3.1
    - key: rel_mount_stiffness
      to: hw-lead
      value: '面接触。① 金属骨架托架沿 PCB 长边托住, 接触面 >=40x8mm (有效跨距约3mm) -> 板弯 sigma≈17MPa, 满足 <=板材许用x0.5 (50-70MPa);
        2xM1.2 螺钉只做防翘压紧, ⌀2.0H7 定位销只防转, 均不承担弯矩。② 承力面必须是金属骨架/机加工件, 不是 P2S 打印面 (FDM ±0.2-0.3mm 打不出 H7, 且打印层纹垂直受力方向会层间剥离)。③
        PCB 不进铰链弯折区: 弯折全部由跨铰链 FPC 承担 (R>=3.0mm), 故 PCB 与焊点弯折应力≈0, MLCC 陶瓷开裂风险归零。④ 跌落 10 次后用同一块板的 3 个位置
        (FCCSP/BTB/电感) X-ray + 1 处切片复核。 [推算-设计承诺, 未实测] 依据: MECH/MECH_BUDGET.md §1.3 M1 + §5.5, MECH/RELIABILITY_TEST_PLAN.md
        §B12 K-8 / §B5 T-01'
      ref: MECH/RELIABILITY_TEST_PLAN.md#b12 + MECH/MECH_BUDGET.md §1.3 M1
    - key: emc_mech_interface_ask
      to: main
      value: 'D8 跨铰链走线长度预算(mm, 框内+铰链+脚内): CSI 102-144 / DSI 87-129 / USB 42-84 / 电源 27-59 (铰链段=90°弧长4.71+间隙2-4);
        D9 互连形式: 充电板↔主板 = 1×8@0.5mm 跨铰链 FPC (SYS×2/检测×2/状态×2/GND×2, 电池在镜脚则 10p 扛 1.5A) + 独立 4p@0.5mm USB
        差分 FPC (>=4层, 90Ω±10%, 全 0.5mm pitch), 全 0.5mm pitch (1.27mm FFC 达不到 R3.0 弯折寿命); D7 只能答一半: 5 类金属件与
        FPC 间距 (骨架>=3.0mm/Type-C 屏蔽壳>=3.0mm/铰链件>=0.5mm/PCB 定位销>=0.5mm/充电板铝罩), 建议屏蔽壳+骨架单点接地, 但 ''外露金属件''
        定义与活动铰链能否做全单点接地需 EMC 给口径 (已发需求)'
      ref: 'MECH/USB_HINGE_STRUCTURE.md#3.3 + #4.5 + #5.3'
    open_questions:
    - id: MECH-Q1
      to: main
      text: 675mAh 形态否决的兜底方案 (拆左右镜脚分摊电池) 是否走? 还是靠 Q4 口径把电池压下来
    risks:
    - id: R-mech-heat
      text: 持续满载 1.22W 与'眼镜贴皮肤佩戴'热学上不相容 (差 6-8 倍)。出路是降功耗不是加散热片
      severity: high
    - id: R-mech-thickness
      text: '电池容量直接决定镜腿厚度: 340→7.3mm / 575→8.7mm / 675→11.2mm (华为 6.25mm 的 1.8 倍, 形态否决)'
      severity: high
    - id: R-mech-splitter
      text: 'R13 分光件自研: 必须与光机共基准 (0.25°→40mm 臂长 0.175mm), 分光面需 ≤5µm 而 FDM 是 Ra 10-30µm → Plan B 双光机在结构上比一拖二更简单'
      severity: high
    - id: R-mech-chargeboard
      text: 充电板只 0.2cc 但吃 25mm 长度, 是镜脚长度超标唯一元凶 → 必须挪出镜脚
      severity: medium

        (板宽 30 ⇒ SoC 边缘到板边 6.40mm/边), ⇒ 骨架/石墨的 V 向覆盖要跟着加宽, 我在 fit_check_v3_30mm.py §4 已按 ''V 覆盖 12.0 →
        30.0 满宽'' 算重量 (+1.215g/侧), **但覆盖边界 (X 起止) 我没有独立定过** —— 本单按 ISS-092 §8 的 L58.5..82.5 沿用 ⇒ 若你要别的起止,
        给我数字我改。麦克风落位那条: 若骨架贯通全板 ⇒ 镜脚外侧面无 ≥40mm 合规落位 —— 与我的答复一致 (不贯通)。'
      ref: MECH/fit_check_v3_30mm.py §4 + MECH/SERVICE_PORT_ISS092.md §8 + 分片 skeleton_extent
    - key: iss121_mic_count_spec
      to: hw-lead
      value: '**接受你的建议: 每侧镜脚 1 颗 MEMS (L/R 一对)** —— 结构侧核算: 镜脚外侧面 ≥40mm 合规带确实只有板 X≤8.00 一处 (再往右到 X≥45 就离检修口通窗只剩
        4.2mm, 且 §1.2 的通窗开口 X 49.21..59.41 也在那儿) ⇒ 两孔间距 ≥40mm 在 **同一侧镜脚** 上做不到; 而 ''镜框前框总宽 140mm'' 的 L/R
        跨距方案结构上零成本 (不占 PCB 面积、不加线、不改铰链区)。★**但我给一个你清单里没有的约束**: L/R 跨距 140mm 满足 ''防声学串扰'' 判据, 却不满足 ''**单颗麦到同侧
        PCB/SoC 的距离**'' 这个电磁判据 —— 麦若装在镜框前框侧, 它离 **充电板/Type-C 座** (ISS-014 决策 5 已把充电板挪到镜框端件!) 就在同一块金属上
        ⇒ **充电板的开关噪声与麦同处**, 这比磁铁-麦间距更值得担心 (N35 静态场 vs 开关噪声)。⇒ 建议把麦放在充电板 **对侧** (即充电板在右端件 ⇒ 麦走左), 并把 ''麦
        vs 充电板距离'' 提为一条硬判据 (我的建议: ≥30mm, 需 sw-lead 复核 I2S/PDM 载流)。'
      ref: MECH/MECH_BUDGET.md §802 + MECH/SERVICE_PORT_ISS092.md §3.1
    open_questions:
    - id: MECH-Q1
      to: main
      text: 675mAh 形态否决的兜底方案 (拆左右镜脚分摊电池) 是否走? 还是靠 Q4 口径把电池压下来
    risks:
    - id: R-mech-heat
      text: 持续满载 1.22W 与'眼镜贴皮肤佩戴'热学上不相容 (差 6-8 倍)。出路是降功耗不是加散热片
      severity: high
    - id: R-mech-thickness
      text: '电池容量直接决定镜腿厚度: 340→7.3mm / 575→8.7mm / 675→11.2mm (华为 6.25mm 的 1.8 倍, 形态否决)'
      severity: high
    - id: R-mech-splitter
      text: 'R13 分光件自研: 必须与光机共基准 (0.25°→40mm 臂长 0.175mm), 分光面需 ≤5µm 而 FDM 是 Ra 10-30µm → Plan B 双光机在结构上比一拖二更简单'
      severity: high
    - id: R-mech-chargeboard
      text: 充电板只 0.2cc 但吃 25mm 长度, 是镜脚长度超标唯一元凶 → 必须挪出镜脚
      severity: medium
    - id: R-mech-service-port-tip-v
      text: 镜脚末端外侧面 V 净高未定义 [0数据] (镜腿是上宽下窄锥形) => 开口 4.60 + 两侧 1.25 = 需要 7.10mm; 若不满足只能开口往根部挪或启备选 SP-C
        (下方开孔)
      severity: medium
    - id: R-mech-service-port-magnet
      text: 检修口磁吸用 N35 钕铁硼, 对 MEMS 麦克风的磁场影响未验 [0数据] (麦克风磁场敏感度项目里没有); 间距 >=40mm 大概率无碍, 但磁铁牌号应选低矫顽力或改弹性卡扣
      severity: medium
    - id: R-mech-service-port-coplanarity
      text: 产线 pogo 压 10 针焊盘的共面度 <=0.05mm 依赖 PIN-SET-2 定位链 (重复性 0.046mm); 若骨架/PCB 装配超差会出现 1-2 针压不到 =>
        选自浮动 pogo + 夹具加 0.05mm 通止规自检
      severity: medium
    - id: R-mech-service-port-seam
      text: 磁吸+自攻螺钉若**无密封条**, 搭边缝/螺钉孔/磁铁缝全是水路 => **IPx4 不成立** (只能宣称防汗); 量产必须加 PORON 0.50x1.50 密封条 + 0.50mm
        迷宫搭边, 且 IPx5/x7 浸水仍不可达
      severity: low

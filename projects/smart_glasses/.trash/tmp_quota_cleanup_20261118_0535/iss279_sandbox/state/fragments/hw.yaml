    1.31uA) / 备选降级档 D (2.0M+1.0M ⇒ 1.400V / 77.8% / 1.40uA); 代价: 60ms 端到端延迟 / 充电时间 / 单 pin 载流 / 皮肤温度 四项均不受影响
    (分压链是高阻小电流支路, 不在充电功率路径上), 差别只在电压余量 0.205V vs 0.381V 与电量读数分辨率; 影响: state/gen_netlist.py BAT_DET 段 +

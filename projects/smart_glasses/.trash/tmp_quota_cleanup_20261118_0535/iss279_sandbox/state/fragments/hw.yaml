- key: iss167_som_io_domain_check
  to: main
  item: '★**还差一个 SoM 侧的问题, 请转 sw-lead/查 SoM 文档 (不是查 SoC)**: 官方 RK3572 datasheet **没有 GPIO bank → VCCIO
    供电组的对应表** —— 它只说『VCCIO1_VCC 这个网名属哪一档电压』。★**已知**: `1.8V only` = PMUIO0_VCC1V8 + VCCIO0_VCC1V8 (max
    1.98V); `1.8V/3.3V` = PMUIO1_VCC + VCCIO1~6_VCC (max **3.63V**); `1.2V/1.8V` = VCCIO7_VCC (max 1.98V)。★**我们关心的
    I2C0_SCL/SDA = GPIO0_B0 (球 1K21) / GPIO0_B1 (球 U32)** ⇒ ★**这两脚挂哪个 VCCIO 组 = [0数据]** ⇒ ★**须查 FET3572-C
    模组的 IO 域文档或 BSP rk3572.dtsi 的 io-domains / rockchip,pins 里的 VCCIO 网名**。★**为什么还要查**: 结论虽已从『I2C_A 整条降
    1.8V』改成『2.8V, 理由只剩 sensor 侧 abs-max』, 但**若 GPIO0 实际挂在 VCCIO0 (1.8V only) ⇒ 2.8V 仍违规** ⇒ ★**这条不查, I2C_A
    的 2.8V 就只是『大概率成立』不是『已成立』**。★**纠正一条旧记录**: 我 11-02 写的『VCCIO1_VCC 属 1.8V only ⇒ I2C_A 要整条降 1.8V』是 **pdftotext
    多行单元格错位**造成的⇒ 11-06 已用 p.39 渲染图核对推翻 (见 HW/RK3572_PIN_TABLE/figs/p39_gpio_crop2.png) ⇒ ★**sw-lead 的
    `iss148_rk3572_gpio0_vccio_domain_check` 这条 need 我已在本周直接答复** (见我方 answers)。'

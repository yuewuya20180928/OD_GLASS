  item: '★**ISS-181 本周结论: 45 条未连接里 23 条是差分腿, 根因是物理约束不是算法** —— SoM BTB **0.4mm pitch · 0.2mm 焊盘 ⇒ 间隙 0.200mm**;
    0.20mm 线 + 两侧 0.20mm 净距 = 需 **0.600mm > 0.400mm pitch** ⇒ **沿排方向物理穿不过去**。 ★**自研 A* 与 freerouting 2.1.0
    两个独立引擎撞同一堵墙 (三重实证)** ⇒ **不是算法不够好**。★**三条出路, 按代价排序, 都需要设计变更 (要你拍板哪条)**: **① 改布局 (建议先做, 不动网表不动封装)**
    —— 挪 R_SEL/串阻/连接器腾出脚与走廊 (v56 实测: 只挪 R_SEL 而不挪配套 TP ⇒ 配套 TP 被挤到 y=8.80 正好堵在 BTB 焊盘排上方 0.84mm ⇒ 反而更差;
    ★**⇒ R_SEL 与它的 TP 必须一起钉位**); **② 改封装** —— SoM BTB 换 dog-bone / 换 pitch (0.4 → 0.5mm) ⇒ ★**但 FET3572-C
    模组是外购件 ⇒ 换 BTB = 换模组或换转接板, 周期与成本要你核**; **③ 改工艺** —— BTB 出脚线宽 0.20 → **0.15mm (6mil, 行业标准, 板厂几乎都能做)**
    ⇒ ★**但实测这一条单独走不通**: v57 臂 DRC=115 (108 条 track_width 是**板规则** 0.2 vs 实际 0.15 + 7 条真 clearance) ⇒ **必须同时改板规则
    min_width + FAB_ORDER_NOTES 的 0.20mm 口径**, 不是只改路由器。★**另有一条好消息**: 0.0625mm 网格阶梯已把 **unc 45→42** 且**零退铜/零差分死腿/零孤岛变多**
    ⇒ ★**只差把 DRC 12 条清零就能晋级** ⇒ ★**这是本周离『可下单』最近的一步** ⇒ 请给路线拍板 + 板规则/工艺变更的批准。'

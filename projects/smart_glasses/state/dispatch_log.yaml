- issue: ISS-053
  agent: sw-lead
  at: '2026-10-25'
  brief: '背景: 老板 19:33 拍板『不裁剪, 后级只缩放』+ 硬件总工定路线 = 鱼眼(等距) 对角 120° → 画面保持鱼眼原始形状。

    后果: **检测框在图像上是弯的** → 若直接把图像像素坐标当方位角用, 框位置与框龄会带**系统性误差** (框龄直接决定 age=1/2 → 端到端 50.3 vs 67.0ms)。

    要做: ① 定义''图像像素 → 真实方位角''的反投影步骤 (等距鱼眼 r=f·θ 的逆映射, 含畸变系数) ② 框龄计算必须用**反投影后的方位角**而不是像素行 ③ 评估不做 LDC (畸变校正重采样) 对 OD 精度的影响 —— 角落目标变形的框与 GT 怎么对齐 ④ '

    检修口壁 7 项 + 盖板 9 项、ISS-065 5 项对应实物项; ④ 探测记录 (ENV_PROBE_20261101.md)。**升级为 [实测] 的唯一路径**: 打印 + 按 89 项清单量
    + 回填 (needs_from boss: 打印与量测执行方, due 2026-11-08)。按纪律, 绝不拿推算/模型值冒充实测。'
- id: M-FIT
  name: 电池 / PCB / 光机 装配干涉检查
  value: '镜脚侧: 通过但 V 链临界 (板宽30 ⇒ V余量 2.00/最坏1.40); 板厚1.22 档检修口净空 4.48 破 4.50 硬要求; 镜框侧: 未验'
  unit: 通过或不通过
  kind: 推算
  by: mech-lead
  when: '2026-11-01'
  evidence: MECH/fit_check_v3_30mm.py (板宽 30mm / RK3576 基线下的设计态干涉检查, rc=0; 板层数 [0数据] ⇒ 板厚按 0.41/0.80/1.00/1.22
    四档全算) + MECH/print/verify_pack_revb.py (打印包模型自检 93/93 + 38/38) + MECH/print/MEASURE_CHECKLIST.md (89
    项实测清单) + MECH/print/ENV_PROBE_20261101.md
  note: '★ 这是 **设计态几何 + 公差栈计算**, 不是物理装配实测 ⇒ kind 诚实写 [推算], 阶段门 G2 不认 (符合预期)。【板宽 30 后的新账 (2026-11-01 翻案)】①
    **V 链是唯一被板宽打穿的链**: 板宽 30 + 走线槽 6 = 36.00 vs 净高 38.00 ⇒ 余量 2.00 (最坏 1.40) ✅ 过判据 0.60, 但比板宽 15 时少 15.00;
    板宽硬顶 = 38.00-6.00-0.60 = **31.40mm**。② **H/L 链一字不动**: H 控制段仍是电芯段 6.35 (余 0.95/最坏 0.65); L 需求 115.50
    vs 130.00 (余 14.50)。③ ★**检修口净空随板厚变 (新发现)**: 净空 = 7.30-(0.80 皮肤壁+0.50 隔热垫+0.30 空气隙+板厚) ⇒ 板厚 0.41/0.80/1.00
    → 5.29/4.90/4.70 ✅, **1.22 (ISS-122 模型A 9层) → 4.48 ❌ 差 0.02 破 ISS-085 的 4.50 硬要求** ⇒ ISS-092 C-5/P-1
    口径要随板厚档位重算 (已登记 needs)。④ **电池空间/续航完全不变** (串行排布, 板宽只吃 PCB 段的 V) ⇒ 板宽 30 换到的是 PCB 面积, 不是电池。⑤ **重量代价**:
    PCB +1.332g (4层) / +1.665g (6层) + 金属骨架 +1.215g/侧 (V 覆盖 12→30 满宽) ⇒ 整机 +3.76~4.10g ⇒ 48.9-74.0g → **52.7-78.1g**,
    目标 30-40g 更远 [推算]。⑥ **镜框侧仍全未验** (走鹃Ⅱ 三维尺寸 u1 / 波导 2D 外形图 u4 / 端件截面 u8b / 摄像头 u5) ⇒ 光机·波导干涉 **无法判定**;
    **波导彩虹纹指标 = [0数据]** (JBD 未选型 ⇒ 无 2D 图/无厂家指标, 已登记 needs)。★ **口径更正**: PROJECT_TRACKER §(1.43) 那句 ''镜腿截面

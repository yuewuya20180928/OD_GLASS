  name: 电池 / PCB / 光机 装配干涉检查
  value: '镜脚侧: 通过但 V 链临界 (板宽30 ⇒ V余量 2.00/最坏1.40); 板厚1.22 档检修口净空 4.48 破 4.50 硬要求; 镜框侧: 未验'

needed:
- id: M-NPU
  name: NPU 纯硬件耗时 (yolov5 INT8 单帧, 不含前后处理)
  unit: ms
  why: 决定框龄 age=1 还是 2 → 端到端 50.3ms 还是 67.0ms, 直接决定 Q1 达不达标
  gate: G3
- id: M-E2E
  name: 端到端实测 (按 Q1 拍板的口径)
  unit: ms
  why: 硬指标 <60ms 的唯一有效证据
  gate: G3
- id: M-SKIN
  name: 皮肤侧温度 (贴片热电偶, 稳态)
  unit: °C
  why: 硬指标 ≤43°C (ISO 13732-1); 推算值 46.5°C 不算数
  gate: G3
- id: M-POWER
  name: 整机功耗 (持续满载 / 待机 两档)
  unit: W
  why: 决定电池档位、镜腿厚度、以及散热是否达标
  gate: G3
- id: M-BATT
  name: 续航实测 (按 Q4 拍板的口径)
  unit: min
  why: 硬指标 ≥1h
  gate: G3
- id: M-CHRG
  name: 充电场景皮肤侧温度
  unit: °C
  why: 推算 75.1°C 属烫伤风险, 必须实测确认挪板有效
  gate: G3
- id: M-OPTIC
  name: 光机逐帧延迟 (高速摄影或示波器)
  unit: ms
  why: 端到端链路里唯一无法用软件打点的环节
  gate: G3
- id: M-PRINT
  name: P2S 打印件实测尺寸 (关键配合尺寸)
  unit: mm
  why: AGENTS.md 明确要求"含实测尺寸"; 0 件已打 = 结构关不能过
  gate: G2
- id: M-FIT
  name: 电池 / PCB / 光机 装配干涉检查
  unit: 通过或不通过
  why: 空间账是推算, 装不下就是全错
  gate: G2
- id: M-WEIGHT
  name: 整机实测重量
  unit: g
  why: 目标 30-40g; 推算 50.1-74.0g 已超
  gate: G2

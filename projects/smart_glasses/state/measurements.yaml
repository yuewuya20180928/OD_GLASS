  note: '★ 这是 **设计态几何 + 公差栈计算**, 不是物理装配实测 ⇒ kind 诚实写 [推算], 阶段门 G2 不认 (符合预期)。【板宽 30 后的新账 (2026-11-01 翻案)】①
    **V 链是唯一被板宽打穿的链**: 板宽 30 + 走线槽 6 = 36.00 vs 净高 38.00 ⇒ 余量 2.00 (最坏 1.40) ✅ 过判据 0.60, 但比板宽 15 时少 15.00;
    板宽硬顶 = 38.00-6.00-0.60 = **31.40mm**。② **H/L 链一字不动**: H 控制段仍是电芯段 6.35 (余 0.95/最坏 0.65); L 需求 115.50
    vs 130.00 (余 14.50)。③ ★**检修口净空随板厚变 (新发现)**: 净空 = 7.30-(0.80 皮肤壁+0.50 隔热垫+0.30 空气隙+板厚) ⇒ 板厚 0.41/0.80/1.00
    → 5.29/4.90/4.70 ✅, **1.22 (ISS-122 模型A 9层) → 4.48 ❌ 差 0.02 破 ISS-085 的 4.50 硬要求** ⇒ ISS-092 C-5/P-1

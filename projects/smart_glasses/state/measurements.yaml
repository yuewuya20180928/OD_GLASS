needed:
- id: M-NPU
  name: NPU 纯硬件耗时 (yolov5 INT8 单帧, 不含前后处理)
  unit: ms
  why: 决定框龄 age=1 还是 2 → 端到端 50.3ms 还是 67.0ms, 直接决定 Q1 达不达标
  gate: G3
- id: M-E2E
  name: 端到端实测 (按 Q1 拍板的口径)
  unit: ms
  why: 硬指标 <60ms 的唯一有效证据
  gate: G3
  method: '★**两段拼起来才是完整端到端**: (a) **软件打点** (口径C: 读出完成→出光) —— 9 个埋点 t_capture/t_pre/t_npu/t_sdk_total/t_decode/t_draw/t_compose/t_display/t_e2e
    ⇒ 测的是**我们自己的代码 + 传感器读出**; (b) **手机慢动作法** (老板 2026-11-04 10:03 定: 不用高速相机, 用手机) ⇒ 测的是**物理端到端** (场景动作
    → 屏幕出现), 含面板自身光电延迟 ⇒ ★**前置**: 显示画面必须烧**帧计数器/时间码** (否则数不出帧) ⇒ ISS-179; ★**读数规则**: 240fps 下 1 帧 = 4.17ms,
    每条件重复 ≥10 次取中位数, 报告 ±1 帧'
- id: M-SKIN
  name: 皮肤侧温度 (贴片热电偶, 稳态)
  unit: °C
  why: 硬指标 ≤43°C (ISO 13732-1); 推算值 46.5°C 不算数
  gate: G3
  deferred: true
  deferred_to: 整机/量产阶段 (贴皮肤热学)
  note: '★2026-11-04 09:57 老板指示「当前 demo 板不考虑温度, 热电偶不需要」 ⇒ ★**本项不进当前 demo 阶段验收范围**, 且**热电偶/假皮肤工装一律不采购**。★**没删,
    只是挪阶段**: 43°C 是 ISO 13732-1 的皮肤烧伤红线 (镜腿是 8h+ 持续接触面) ⇒ ★**触发重开条件**: ① 整机样机做贴皮肤稳态测试 ② 量产前必须回来 (否则等于放弃安全红线)
    ③ 若改按需触发把整机功耗压到 ~0.23W, 则按新功耗重算温度再决定测不测。'
- id: M-POWER
  name: 整机功耗 (持续满载 / 待机 两档)
  unit: W
  why: 决定电池档位、镜腿厚度、以及散热是否达标
  gate: G3
  note: '★**口径分两层**: demo 阶段能量的是「**demo 板 + 模组总功耗 (USB-C 5V 输入)**」⇒ 作为整机功耗的**参考下界**, **不是**"整机功耗"本身 (整机还要加电池/镜框/波导/光机的自耗)
    ⇒ ★**对外报数必须写清是哪一层**, 别拿 demo 数当整机数。★整机功耗 (持续满载/待机两档) 留到整机阶段。'
- id: M-BATT
  name: 续航实测 (按 Q4 拍板的口径)
  unit: min
  why: 硬指标 ≥1h
  gate: G3
  deferred: true
  deferred_to: 整机阶段 (demo 板没有电池)
  note: '★2026-11-04 10:09 自查抓到: **demo 板直接 USB-C 5V 供电, 不装电池/不上充电链** (老板 11-02 19:25 定的形态) ⇒ ★**续航在 demo
    板上根本测不了** (没有电池可放) ⇒ 本项挪到整机阶段。★触发重开: ① 整机装上电池 ② 老板重新要 demo 带电池版。'
- id: M-CHRG
  name: 充电场景皮肤侧温度
  unit: °C
  why: 推算 75.1°C 属烫伤风险, 必须实测确认挪板有效
  gate: G3
  deferred: true
  deferred_to: 整机/量产阶段 (贴皮肤热学)
  note: '★2026-11-04 09:57 老板指示「当前 demo 板不考虑温度, 热电偶不需要」 ⇒ ★**本项不进当前 demo 阶段验收范围**, 且**热电偶/假皮肤工装一律不采购**。★**没删,
    只是挪阶段**: 43°C 是 ISO 13732-1 的皮肤烧伤红线 (镜腿是 8h+ 持续接触面) ⇒ ★**触发重开条件**: ① 整机样机做贴皮肤稳态测试 ② 量产前必须回来 (否则等于放弃安全红线)
    ③ 若改按需触发把整机功耗压到 ~0.23W, 则按新功耗重算温度再决定测不测。'
- id: M-OPTIC
  name: 光机逐帧延迟 (高速摄影或示波器)
  unit: ms
  why: 端到端链路里唯一无法用软件打点的环节
  gate: G3
  deferred: true
  deferred_to: 由 M-DIZZY (主观) 替代 —— 老板 10-25 19:23 拍板 q18_highspeed_cam
  note: '★**不测绝对数字**: 老板 10-25 19:23 已决定「光机延迟不外部测设备 (高速相机/示波器), 改目测/感官验收」 ⇒ 高速摄影 + 示波器 + 光电探头 **一律不采购**。★**客观后果
    (别忘)**: 这一项不测 ⇒ ① 端到端链路的**曝光起点 (口径A)** 无法闭合 ⇒ 端到端只能报**口径C (读出完成→出光)** 的数 ② 主观验收验不了"60ms"这个数 ⇒ 决定 60fps
    成败的仍是 **M-NPU (软件打点)**。 ★**2026-11-04 10:03 补充**: 手机慢动作法能测的是**端到端物理延时 (含面板光电延迟)**, 但**分不开"面板自身那一段"**
    ⇒ 本项 (只测面板自身光电延迟) 继续 deferred, **不因手机法而复活**。'
- id: M-PRINT
  name: P2S 打印件实测尺寸 (关键配合尺寸)
  unit: mm
  why: AGENTS.md 明确要求"含实测尺寸"; 0 件已打 = 结构关不能过
  gate: G2
  tools: '★工具 (清单 §2.1): 数显卡尺 0.01mm (孔径/外形/台阶高) + 千分尺 0.001mm (薄壁/台阶高, ★卡尺测爪会顶开 0.4mm 薄壁) + 塞尺 0.02-0.10mm
    一档 (0.10-0.50mm 细间隙) ⇒ 角度用卡尺两点高差算或手机角度尺 App'
  deferred: true
  deferred_to: 整机阶段 (结构开工时)
  note: '★2026-11-04 10:09 老板指示「打印环境暂时不需要, demo 板阶段为什么需要打印」 ⇒ ★**打印/量具线当期整体推后** (不订打印环境, 不买卡尺/千分尺/塞尺/电子秤)。★**依据**:
    老板 **11-02 19:25** 已定「硬件优先, **结构不考虑**」(结构单冻结不投人; demo 形态 = 一块主板 + sensor 模组 + 屏幕模组 + 板内 FPC, 跨铰链取消,
    **不装电池**); 11-02 显示件改 **视涯 0.49" 面板** ⇒ 原光机位姿/走鹃Ⅱ 那套干涉检查也随之作废 (ISS-016)。★**触发重开条件**: ① 整机阶段结构开工 (波导/光机/镜框路线定下来)
    ② 老板重新要结构样机。★**没删**: 判据与测量清单 (Rev B, 11 段 92 条) 全部保留, 到时直接用。'
- id: M-FIT
  name: 电池 / PCB / 光机 装配干涉检查
  unit: 通过或不通过
  why: 空间账是推算, 装不下就是全错
  gate: G2
  tools: '★工具: 同 M-PRINT (卡尺 + 千分尺 + 塞尺) + 装配试装 (电池/PCB/光机位姿); ★波导槽平行度用"手机拍 + CAD 拟合"顶替百分表'
  deferred: true
  deferred_to: 整机阶段 (结构开工时)
  note: '★2026-11-04 10:09 老板指示「打印环境暂时不需要, demo 板阶段为什么需要打印」 ⇒ ★**打印/量具线当期整体推后** (不订打印环境, 不买卡尺/千分尺/塞尺/电子秤)。★**依据**:
    老板 **11-02 19:25** 已定「硬件优先, **结构不考虑**」(结构单冻结不投人; demo 形态 = 一块主板 + sensor 模组 + 屏幕模组 + 板内 FPC, 跨铰链取消,
    **不装电池**); 11-02 显示件改 **视涯 0.49" 面板** ⇒ 原光机位姿/走鹃Ⅱ 那套干涉检查也随之作废 (ISS-016)。★**触发重开条件**: ① 整机阶段结构开工 (波导/光机/镜框路线定下来)
    ② 老板重新要结构样机。★**没删**: 判据与测量清单 (Rev B, 11 段 92 条) 全部保留, 到时直接用。'
- id: M-WEIGHT
  name: 整机实测重量
  unit: g
  why: 目标 30-40g; 推算 50.1-74.0g 已超
  gate: G2
  tools: '★工具: **电子秤 0.01g** (M-WEIGHT 不在 M-PRINT 里, 单独称整机)'
  deferred: true

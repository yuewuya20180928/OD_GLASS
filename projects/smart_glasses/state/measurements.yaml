    ② 老板重新要结构样机。★**没删**: 判据与测量清单 (Rev B, 11 段 92 条) 全部保留, 到时直接用。'
- gate: G3
  id: M-DIZZY
  name: 眩晕/拖影主观验收 (连续快速头部转动 + 快速走动 + 视线切换, 观察 5 分钟)
  unit: 主观
  why: '替掉 M-OPTIC (老板 10-25 19:23 拍板: 不买高速相机/示波器) ⇒ 零设备成本, 1 台样机即可做'
  judge: 无眩晕 / 无明显拖影 / 无撕裂感; 有则记录现象与出现条件 (FRAMEWORK/QCP.md §主观验收)
  note: ★**主观验收不能替代数字验收** (它验不了"60ms"这个数) —— 两个都做, 各管各的。

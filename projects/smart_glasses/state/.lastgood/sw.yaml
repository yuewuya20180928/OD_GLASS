    yolov5s-sim sha256 互不相同且 clean/v2 两份逐字节相同 (输入 320/320/640)
  ref: SW/MODEL_ASSETS.md#1.1
- key: model_asset_slot_budget
  value: 15MiB
  note: 板端 model_a/model_b 单槽上限 = 15,728,640 B; 来源 FLASH_AND_VERSION §4.1 + s2_rescue_config.example.json;
    只管板端产物, 不管 PC 侧 ONNX; 与 flash_capacity_floor=128MB-NOR-min 是同一条容量线的两半
  ref: SW/MODEL_ASSETS.md#1.6
- key: model_asset_registry_tool
  value: SW/tools/model_asset_check.py
  note: 台账机器复核入口; rc=0 = 台账与实物一致 (不等于可量产, 量产看 L 计数)
  ref: SW/MODEL_ASSETS.md#7
- key: model_asset_release_gate
  value: L=0
  note: '量产放行判据: 放行阻断项计数必须 0 — L1 许可[0数据] / L2 超 15MiB 槽 / L3 chip ID 不符 / L4 AGPL
    商用受限; 当前 L=2 (L1 yolov5s-sim 许可未知 + L4 yolov8s AGPL-3.0)'
  ref: SW/MODEL_ASSETS.md#1.5
- key: model_version_string_fmt
  value: yolov5s-int8-ag2-<sha8>
  note: 与 FLASH_AND_VERSION §2.5.1 一致, 不改; <sha8> = 板端模型文件 sha256 前 8 位; <ag2> = 板端格式版本,
    必填 (A7S NBG format version 坑); 换格式版本必须换版本串
  ref: SW/MODEL_ASSETS.md#4.3
- key: model_calib_min_images
  value: '100'
  note: INT8 校准集最少张数 (A733 实测 6 张不够用); 现有 100 张 = COCO 通用集, 与眼镜场景分布不符, 需自建
  ref: SW/MODEL_ASSETS.md#2.4
- key: model_quant_scheme
  value: pcq
  note: A733 侧真正 INT8 的量化方案名 (per-channel symmetric affine); Art.Galaxy 侧方案名 [0数据]
    (Q9 追加第 3 条); .quantize 量化参数表本身是资产, 换参数=换模型
  ref: SW/MODEL_ASSETS.md#2.3
- key: model_regression_gate
  value: R-01..R-14
  note: 模型变更后必跑的回归用例编号集合 (台账/许可/文件头/容量/加载/数值/量化器/总体精度/逐类精度/阈值/性能/端到端/版本串/刷写回滚), 全过才允许刷板;
    与 BR-01..BR-12 不重叠 (一个测模型, 一个测刷写救砖)
  ref: SW/MODEL_ASSETS.md#4.2
- key: reset_release_policy
  value: PG_AND(V_CORE,V_IO)+SUPV_20ms+RC_1.1ms
  note: 复位释放须 V_CORE 与 V_SOC_IO 同时在 regulation; TPS3808G01 CT 悬空=20ms [官方]; RC 释放
    τ=1.1ms [实测]; 监督器当前只盯 V_SOC_IO ⇒ 需把两路 PG 并联进复位链 (开漏可线与)
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: reset_tau_release
  value: 1.1ms
  note: (10k+1k)×100nF 实算 [实测]; 网表注记 'τ=100ms' 有误 (差 90.9×) ⇒ SW/FLASH_AND_VERSION.md
    §4.5.2.1 的 t1~t4 时序表要重写
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: supv_divider_rule
  value: R1/R2=6.407@3V0V,no-0R-on-both
  note: VIT=0.405×(1+R1/R2) [官方 TPS3808]; 两颗分压都是 0Ω 位, 同时装 ⇒ 下臂 0Ω ⇒ V_SOC_IO 对地短路;
    必须改实值 + 写死装配规则
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: boot_entry_hw
  value: BOOT-static-strap+上电
  note: 复位释放时刻不可预测 (轨爬升 0数据) ⇒ 不用时序化按键; BOOT 需加 0Ω 跳线位 (现在只有 10k 上拉+按键+TP_BOOT); 不得把
    TP_BOOT 接 3.3V (会把 5V 灌进 1.8V LDO)
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: chg_stat_pullup
  value: 10k@3V3-镜脚本地-接收端
  note: R_PU_CHG_STAT 标 CHG_BOARD 但上拉的 RAIL_VDD_3V3_IO 在 MAIN_PCB (充电板无 3.3V 轨), 与
    R_PU_PG(MAIN_PCB) 不一致 ⇒ 必须挪到镜脚本地; 不加施密特, 接收端加 10~100nF (状态位是秒级慢量)
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: chg_state_source
  value: CHG_STAT-主,PG-备,ADC-辅
  note: 充电 IC 的 I2C 不过铰链 (V1.5 裁决 4) ⇒ SW 不许读充电 IC 寄存器; 模拟链 451ms 建立 ⇒ 不能当主判据 (禁 OD
    门禁靠数字链)
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: adc_det_sampling
  value: 长采样+丢弃N+中位数+迟滞
  note: VBUS_DET/BAT_DET 1M+1M+100nF ⇒ 源阻抗 500kΩ/τ=50ms/12bit 建立 451ms/漏电 1µA⇒0.50V
    偏移(15.2%FS) [推算]; M7-R6 '软件侧确认电量读取正常' 判据要重写, 电量百分比只能标低精度
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: i2ca_speed_max
  value: 100kHz
  note: I2C_A 4.7k 上拉在主板侧, 负载跨铰链到 CONN_CAM; 300pF 时 t_r=1195ns > 标准模式 1µs 上限 [官方 I2C]
    ⇒ 速率写死 100kHz
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: tmp117_meas_point
  value: 镜脚PCB-贴皮肤面-SoC投影≤10mm
  note: '★TMP117 测点定案 (ISS-090): 对应 ISO 13732-1 43°C 红线唯一直接相关部位; 皮肤是热沉 ⇒ T_PCB≥T_skin
    保守方向; 自热 16.5µW 可忽略, 误差由热耦合路径主导 [官方 TMP117 贴装要求]; 不选 SoC die (测不到 Tj), 不选电池 (NTC→TS
    已硬件停充)'
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: thermal_tiers_skin
  value: T0<38/T1<41/T2<43/T3>43C,滞回2C
  note: 取代旧 4 档 <70/70-85/85-95/>95C (那是结温口径, 与 43°C 皮肤红线不同源); 依据 MECH 模型 0.05W→37.5/0.10W→40.0/0.16W→43.0°C;
    切档执行必须 ≤1 帧 (16.67ms), 否则 frame age 跳档端到端 +16.67ms
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: thermal_failsafe
  value: 读失败3周期→按T2降载+告警
  note: TMP117 与 camera 同在 I2C_A (跨铰链) ⇒ camera 拉死 SDA 会一起致盲温度保护; SW 必须做 I2C 总线恢复
    (9 时钟+STOP) + 失效安全降载; 首读 = -256°C 必须丢弃 [官方 TMP117]
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: usb_flash_role
  value: 跨铰链=救援/售后,量产=镜脚有线
  note: 跨铰链 USB 不是产线可控环境; 镜脚已有 J_DEBUG(1×4)+J_UART(1×2)+ISS-092 检修口 ⇒ 建议现在就把 USB pogo
    4 点 (VBUS/GND/D+/D−) 画上 (可 DNP), 否则后加要改板重投; Type-C 留镜框做充电+售后自助
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: usb_conn_gnd_pins
  value: ≥2 (CONN_USB pin4→GND)
  note: CONN_USB 只有 1 个 GND pin, 违反 ISS-085 自定规则 (两端各留 ≥2 个 GND pin); pin4 现为预留 DNP
    ⇒ 改 GND 零成本; 同规则还波及 CONN_CAM(1 个) 与 CONN_LIGHT(1 个)
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: power_off_semantics
  value: 无硬件断电-软件深睡-轨带电
  note: '★网表无负载开关/电源开关 (0 颗) ⇒ 电池经 BQ2970 直连 SYS ⇒ ''关机''只能软件深睡; 影响: 售后''长按10s=关机''、老板锁死''待机<0.05W''、关机充电指示灯
    三条都要重定义'
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: first_temp_read
  value: 丢弃首读(-256C)
  note: TMP117 复位后温度寄存器读 -256°C 直到首次转换完成 [官方]; 8 averages/1-Hz ⇒ 首次有效读数最坏 ~1s, 期间不得判过温/低温
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: chg_state_semantics
  value: STAT低=充电中/高=完成或禁用/1Hz闪=故障;PG低=源良好
  note: P10 页 (19:08 落地) 写明的 BQ25896 极性; 充电状态机要解三态 + 闪烁检测 —— 二态判断会把'故障'误判成'完成'或'未充电'
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: chg_state_fail_safe
  value: 状态未知→当作在充电→禁OD
  note: '★CE 被 R_CE 拉低 = 允许充电 (P10 note: ''拉低的好处 = SoC 死机也能充电'') ⇒ 读不到充电状态时实际可能正在充电
    ⇒ 失效安全方向是''当作在充电'' (禁 OD), 不能按''没充电''放行 M-CHRG 门禁'
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
- key: signal_naming
  value: chg_pg_src_ok/dcdc_pg_good/soc_reset_n
  note: '★本设计三个都叫 ''PG'' 的信号语义相反: BQ25896 PG 低=输入源良好 / TPS62130A PG 高阻=在 regulation
    / U_SUPV RESET 低=复位中 ⇒ SW 按来源命名防写反'
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)
open_questions:
- id: SW-Q1
  to: main
  text: 'A7S 封档项目里 cyl_iou_nms / cylindrical 0.40 阈值没带过来 —— 与锁死变量 #2 (80 类 COCO 不做场景定制)
    冲突, 需项目总工裁决'
- id: SW-Q2
  to: main
  text: 显示帧率若降到 25-30fps, 老板的'60fps'锁死项是否要改写
risks:
- id: R-sw-step
  text: 'NPU 延迟台阶效应: 纯 NPU 跨过 16.67ms 边界 → age 从 2 跳 3 → 端到端直接多一整个帧周期 (67→83.7ms)。差
    2ms 可能等于差 17ms'
  severity: high
- id: R-sw-fp32
  text: NPU 强制 FP32 输出 → 反量化占 SDK 总 25% (A733 实测 9.29ms) → 框龄跳档
  severity: high

- key: mech_service_port_fixture_datum
  value: PIN-SET-2 P2+S2
  note: 夹具基准**复用 PCB 的** PIN-SET-2 (P2 phi2.0 H7 @板坐标 X52.00/Y7.50 + S2 phi1.4 @X52.00/Y12.50),
    **不新增夹具基准孔**; P2 孔壁到焊盘阵列最近 1.00mm, S2 孔壁 1.03mm; 焊盘共面 <=0.05mm 由 ISS-049 定位链 (骨架
    <=5um + H7 销 <=0.010 => 重复性 0.046mm) 保证 => 可达
  ref: MECH/SERVICE_PORT_ISS092.md#7.2
open_questions:
- id: MECH-Q1
  to: main
  text: 675mAh 形态否决的兜底方案 (拆左右镜脚分摊电池) 是否走? 还是靠 Q4 口径把电池压下来
risks:
- id: R-mech-heat
  text: 持续满载 1.22W 与'眼镜贴皮肤佩戴'热学上不相容 (差 6-8 倍)。出路是降功耗不是加散热片
  severity: high
- id: R-mech-thickness
  text: '电池容量直接决定镜腿厚度: 340→7.3mm / 575→8.7mm / 675→11.2mm (华为 6.25mm 的 1.8 倍, 形态否决)'
  severity: high
- id: R-mech-splitter
  text: 'R13 分光件自研: 必须与光机共基准 (0.25°→40mm 臂长 0.175mm), 分光面需 ≤5µm 而 FDM 是 Ra 10-30µm
    → Plan B 双光机在结构上比一拖二更简单'
  severity: high
- id: R-mech-chargeboard
  text: 充电板只 0.2cc 但吃 25mm 长度, 是镜脚长度超标唯一元凶 → 必须挪出镜脚
  severity: medium
- id: R-mech-service-port-tip-v
  text: 镜脚末端外侧面 V 净高未定义 [0数据] (镜腿是上宽下窄锥形) => 开口 4.60 + 两侧 1.25 = 需要 7.10mm; 若不满足只能开口往根部挪或启备选
    SP-C (下方开孔)
  severity: medium
- id: R-mech-service-port-magnet
  text: 检修口磁吸用 N35 钕铁硼, 对 MEMS 麦克风的磁场影响未验 [0数据] (麦克风磁场敏感度项目里没有); 间距 >=40mm 大概率无碍,
    但磁铁牌号应选低矫顽力或改弹性卡扣
  severity: medium
- id: R-mech-service-port-coplanarity
  text: 产线 pogo 压 10 针焊盘的共面度 <=0.05mm 依赖 PIN-SET-2 定位链 (重复性 0.046mm); 若骨架/PCB 装配超差会出现
    1-2 针压不到 => 选自浮动 pogo + 夹具加 0.05mm 通止规自检
  severity: medium
- id: R-mech-service-port-seam
  text: 磁吸+自攻螺钉若**无密封条**, 搭边缝/螺钉孔/磁铁缝全是水路 => **IPx4 不成立** (只能宣称防汗); 量产必须加 PORON 0.50x1.50
    密封条 + 0.50mm 迷宫搭边, 且 IPx5/x7 浸水仍不可达
  severity: low

  ref: MECH/RELIABILITY_TEST_PLAN.md#b12 + MECH/MECH_BUDGET.md §1.3 M1
- key: emc_mech_interface_ask
  to: main
  value: 'D8 跨铰链走线长度预算(mm, 框内+铰链+脚内): CSI 102-144 / DSI 87-129 / USB 42-84 / 电源 27-59
    (铰链段=90°弧长4.71+间隙2-4); D9 互连形式: 充电板↔主板 = 1×8@0.5mm 跨铰链 FPC (SYS×2/检测×2/状态×2/GND×2,
    电池在镜脚则 10p 扛 1.5A) + 独立 4p@0.5mm USB 差分 FPC (>=4层, 90Ω±10%, 全 0.5mm pitch), 全
    0.5mm pitch (1.27mm FFC 达不到 R3.0 弯折寿命); D7 只能答一半: 5 类金属件与 FPC 间距 (骨架>=3.0mm/Type-C
    屏蔽壳>=3.0mm/铰链件>=0.5mm/PCB 定位销>=0.5mm/充电板铝罩), 建议屏蔽壳+骨架单点接地, 但 ''外露金属件'' 定义与活动铰链能否做全单点接地需
    EMC 给口径 (已发需求)'
  ref: 'MECH/USB_HINGE_STRUCTURE.md#3.3 + #4.5 + #5.3'
interface_claims:
- key: pcb_outline
  value: 50x12mm
  note: 镜脚截面随电池档位 7.3/8.7/11.2mm; 板宽跟 FCCSP pitch 走 (pitch<=0.3mm -> 15mm, 投板前必须 close);
    与 hw-lead/main 同值
  ref: MECH/MECH_BUDGET.md#5.1
- key: pcb_thickness
  value: 0.8mm(4层)/1.0mm(6层)
  note: 锁死 4-6 层; 4层=0.8mm / 6层=1.0mm; 阻抗控 MIPI 走线
  ref: MECH/MECH_BUDGET.md#5.1
- key: pcb_mounting
  value: 2xM1.2+1x⌀2.0H7
  note: 孔心到板边 2.5mm; 定位靠金属骨架不靠打印面 (FDM 打不出 H7); 器件距板边>=0.8mm
  ref: MECH/MECH_BUDGET.md#5.1
- key: battery_capacity_tier
  value: 无桥接340-575mAh/有桥接575-675mAh
  note: 675mAh 形态否决 (镜腿 11.2mm = 华为 6.25mm 的 1.8 倍); 与 hw-lead/main 同值
  ref: MECH/MECH_BUDGET.md#1.6.2
- key: temple_thickness
  value: 7.3-8.7mm
  note: 340mAh 档 7.3mm / 575mAh 档 8.7mm; 675mAh 档 11.2mm 已否决; 华为镜腿 6.25mm 基准
  ref: MECH/MECH_BUDGET.md#1.6.2
- key: temple_cavity_length
  value: ≥110mm

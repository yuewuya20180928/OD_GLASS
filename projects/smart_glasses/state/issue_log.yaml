    ★要测的: ① 板端 RK3572 上 YOLOv5s INT8 640×480 的**纯 NPU 单帧耗时** (判据 ≤20.33ms, 与 RK3576 同口径) ② 端到端模式A 打点 ③ INT8 F1 (看量化损失是否也在 4 TOPS 档劣化) ④ **供电方式与散热条件** (影响降频, 眼镜腔体无主动散热)。


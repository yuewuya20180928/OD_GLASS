  note: "2026-10-28 00:5x 项目总工代登记 (sw-lead 在 ISS-087 里抛的 STATE 阻塞, 防止在状态里腐烂)\n★2026-10-28 08:2x 项目总工验收关单。sw-lead 交卷 (01:01) 后 issue_log 一直挂在 open 没落 fix_ref ⇒ 现补。\n【核心突破: [0数据] → [实测]】唯一许可干净候选 (Apache-2.0) 的 NPU 可转换性: 本机已有 tf2 conda 环境 (TF 2.20.0) ⇒ 装 tf2onnx 1.16.1 后\n  第 1 段 (TF SavedModel → ONNX) 实测 rc=0: 12,259,298 B / opset 13 / 3304 节点 / 33 算子。\n  ★查出两个 NPU 致命问题并解掉: ① **74.7% 的图 (2465/3304 节点) 是 NMS 后处理** (含 NonMaxSuppression(90)/TopK(2)/Range(2)/NonZero(1), NPU 编译器一律拒收) ② **输入是动态 shape** [1,'unk__5514','unk__5515',3] (编译器直接拒) ⇒ 自写 cut_postprocessor.py + fix_static_shape.py → **299 节点 / 18 算子 / 静态 [1,320,320,3]**, 与全图输出 **max_abs_diff = 0.000e+00 (逐位相同)**。做法与本机 awnpu_model_zoo/examples/yolox 原厂配方同构 (extract_model 只留 head)。\n  第一组真实精度: 299 张 COCO val2017 → **P=0.4521 R=0.4184 F1=0.4346** (person R=0.532)。\n【第 3 段缺件】M1~M10 逐条列出 (M3/M4/M9/M10 为新增, 建议并入 Q9) + 4 条『拿到工具链前的可行性判断依据』 (不是猜通不通, 而是把不确定性从 74.7% 的图缩到 3 个节点); 并发现一条现在就能做的下一步: 用本机 ACUITY 工具链试跑第 3 段 (已记为 R-U6 请求拍板, ⚠️ ACUITY ≠ Art.Galaxy, 不得当 ARS45 实测)。\n【AGPL 商用路径】5 个 Apache-2.0 候选逐条给许可/先例/代价。签字人 = boss (走项目总工, sw-lead 不拍板)。建议路径 1 (采购 Enterprise) 与路径 2 (换 Apache-2.0 栈) 并行准备 (等待期不产生工程进展)。\n【判据写死】L=0 判据写进复核器 (C10~C13 + L6/L7/L8, 五组判据 G1~G5) 并做了**反例验证** (注入缺陷后复核器立刻变红 ⇒ 判据不是摆设)。\n【★它自查出的真 bug】复核器自己的 C9 冒烟硬编码 float32, 而本模型输入是 uint8 ⇒ 会把好模型判成坏模型 (实测 FAIL=1 / L=1) ⇒ **这个 bug 会让『Apache-2.0 路线不可用』这个错误结论凭空成立** ⇒ 已修。\n【诚实缺口】健康度仍 red: 板端 INT8 产物仍是 0 个 (卡第 3 段: 等原厂工具链 + chip ID + 板子, 且采购待老板拍板)。**『量产可用模型清单』从空集变成 1 条待第 3 段落地的候选** —— G5 (板端产物 + 板端实测) 尚未满足, L=0 只覆盖 G1~G4。\n【自证复现】python3 SW/tools/model_asset_check.py rc=0 (资产 13 条 · FAIL 0 · WARN 33 · 重复组 1; **★交付集里 NPU 就绪且有实测精度的产物: 2 条**; 量产放行阻断项 L=0)。"

  desc: '★**这是换 RK3572 之后最要紧的一条**。算式: RK3576 实测链 (sw-lead RKNN bench, model_zoo 57.5~65.0 FPS) ⇒ 纯 NPU **15.4~17.4ms**, 模式A **55~57ms**; RK3572 = **4/6 TOPS** ⇒ 纯 NPU [推算] **23.1~26.1ms** ⇒ 模式A [推算] **62.7~65.7ms** ⇒ **超老板锁死的 60ms 硬指标 2.7~5.7ms** (仍在 3.5 项 ≤70ms 容差内)。


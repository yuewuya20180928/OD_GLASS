    后果: **检测框在图像上是弯的** → 若直接把图像像素坐标当方位角用, 框位置与框龄会带**系统性误差** (框龄直接决定 age=1/2 → 端到端 50.3 vs 67.0ms)。

    要做: ① 定义''图像像素 → 真实方位角''的反投影步骤 (等距鱼眼 r=f·θ 的逆映射, 含畸变系数) ② 框龄计算必须用**反投影后的方位角**而不是像素行 ③ 评估不做 LDC (畸变校正重采样) 对 OD 精度的影响 —— 角落目标变形的框与 GT 怎么对齐 ④ 把这条写进 ISP/后处理 pipeline 的需求与验收标准

    验收: ① 反投影公式与参数 (f 与畸变系数) 明确写出 ② 框龄口径从''像素行差''改为''方位角差'' ③ 给出不做 LDC 的精度影响评估与兜底 (必要时只对画面中心区做校正)

    依据: HW/LENS_SELECTION.md §B6.4 RFQ 第 9 条 + §B7 卡点 6'

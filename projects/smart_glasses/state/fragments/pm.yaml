    偏低 3.33 倍, 已标 [旧口径·已作废]. 选电芯仍用 B 口径 P×361.81 (含 ÷0.83 充电效率, 偏保守 20% ⇒ 安全) —— 0.83 是充电输入→电池的效率, 只影响充电时间,
    不影响电池放电续航. 老板锁死项全部不受影响 (关机行用真电流 108µA 从未用错算式; §0#38 按需 ≥1h 更宽裕 6.08h/4.92h). 热学结论不变 (算的是功耗侧), 但续航变长

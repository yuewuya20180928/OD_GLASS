  since: '2026-10-24'
  decision: "宽高比无所谓。老板 10-25 19:16 拍板: 宽高比无所谓的, sensor 只要能够输出 1920×1080@60fps 或以上即可。★ 原 A/B/C 三选一作废, 选型判据改为『≥1080p60\
    \ 出图能力』; sensor 选型即刻解冻。\n老板 10-25 19:33 决定: **sensor 输出先不裁剪, 由后级模块缩放到目标分辨率, 暂时先接受畸变, 后继看效果**。\n★ 这条解掉了『裁剪/畸变』那一半:\
    \ 不裁剪 = 有效视场最大, 缩放由 ISP 做 (已在管线里: ISP → 640×480@60 或 1280×960@15)。\n★ 但『俯角 vs 垂直半视场』那一半**没有被这条消掉**:\
    \ 16:9 对角 100° → 垂直半视场仅 30.3° → 俯角 32° 时正前方仍差 1.7° 掉出画面。\n★ 项目总工据此定的工作基线 (可回退, 未下单): **对角 FOV 提到 120°\
    \ (垂直半视场 40.3°) + 俯角收到 ≤25°** → 俯角 25° 余量 +15.3°, 俯角 32° 余量 +8.3°, 两种俯角都安全。110° 只够俯角 ≤30°, 不够稳。→ 镜头焦距要更短\
    \ → 镜头筒/窗口尺寸要结构跟 (ISS-047 一并复核)。★ 前提: 老板已明确『先接受畸变』→ 更大 FOV 的边缘畸变代价可接受。\n★ **19:42 修正 (硬件总工核算后)**:\
    \ 我 19:33 那版基线用的是**直行 (rectilinear)** 口径 —— 对角 120° → 垂直半视场 40.45°。**但 1/3\"~1/2.6\" 靶面上量产的 120° 镜头是鱼眼\
    \ (等距)** → 同一个\"120° 对角\"的垂直半视场只有 **29.53° (OV04C10) / 31.80° (AR0234CS 16:10)**, 不是 40.45°。\n★ **撤回我那句\"\
    两种俯角都安全\"** —— 走鱼眼路线时俯角 32° 仍会掉出画面。\n★ **修正后的工作基线**: **鱼眼 (等距/等立体角) + 对角 120° + 俯角 ≤25° (OV04C10)\
    \ / ≤28° (AR0234CS 16:10)**\n  · 畸变代价 (老板已接受, 不构成否决): 角落桶形 -39.5% / 水平边 -29.4% / 垂直边 -9.0%\n  · **反向收益**:\
    \ 不做 LDC → ISP 省掉畸变校正重采样 (缓解 §5.7.1 LDC 占 pipeline 预算); 鱼眼角分辨率均匀 (0.0389°/px), 直行 120° 角落比中心粗 4.0\
    \ 倍 → 对边缘目标检测鱼眼反而更好\n  · 为什么必须走鱼眼: 直行 120° 在 1/3\" 靶面要 f=1.78mm、等效光圈缩到 ⌀0.6-0.7mm (f/2.6-3.0) → 弱光信噪比不可接受\n\
    \  · ★ **投影模型必须和 FOV 数字一起写进 RFQ**, 否则报价回来的大概率是鱼眼而结构拿到的余量是错的\n  · ★ 结构侧好消息: 三档 (100/110/120) 的镜筒与窗口需求只差\
    \ ≤0.9mm → **可以不等镜头定档就开模**\n依据: HW/LENS_SELECTION.md"
  decided_at: '2026-10-25'
  decided_by: boss (19:33 不裁剪/接受畸变) + 项目总工推导 (19:33 对角120°/俯角≤25°) → 19:42 经 hw-lead 核算修正为鱼眼口径

  since: '2026-10-25'
  decision: "老板 10-25 19:23 决定: 光机延迟不外部测设备, 改用 **目测/感官验收 (看有没有眩晕)**。\n★ 客观说明: 眩晕/拖影是主观验收, 零设备成本, 1 台样机即可做\

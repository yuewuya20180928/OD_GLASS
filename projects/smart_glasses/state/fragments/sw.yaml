  item: "★ISS-137 rev1 复验时发现: **项目里有两个『DSI 带宽』口径, 差 8 倍**, 而 ISS-137 的 TX 物理下限正压在这个口径上 ⇒ 建议顺手修 (★**不是\
    \ ISS-137 造成的, 是 11-02 就有的**)。\n  ★**证据 (我实算)**: 1920×1080@60 RGB888 = 1920×1080×24×60 = **2985.98\
    \ Mbps**; 800×1280@60 RGB888 = **1474.56 Mbps**。\n  ⇒ `HW/DISPLAY_MODULE_DECISION.md:53` 写 '1920×1080@60\
    \ RGB888 ≈ **373 Mbps**' ⇒ **偏小 8.0×** (反推 bpp = 2.998, 既不是 RGB888 也不是整数口径); `HW/STEP1_PARTS_SPEC.md:375`\
    \ 写 '800×1280@60 ≈ **246 Mbps**; 1920×1080@60 ≈ **373 Mbps**' ⇒ 分别偏小 **6.0× / 8.0×** (246 反推 bpp =\
    \ 4.004 ⇒ **两处彼此也不是一个口径**)。\n  ⇒ ★**对照 (这两处是对的)**: `PROJECT_TRACKER.md:2099` 写 '1920×1080@60 RGB888\
    \ = **2986 Mbps**, 4-lane@2.0Gbps 够' ✔; `HW/e2e_budget_rk3572.py` §⑥ 实打印 'RGB888 payload = **2986.0\
    \ Mbps**' ✔。\n  ★**为什么要紧**: TX 物理下限 = 一帧比特 / 链路有效带宽 ⇒ ★**一旦有人把 2986 换成 373, TX 下限会从 7.776ms 塌到 ~0.97ms\
    \ ⇒ ISS-137 rev0 那个『显示 TX 从账上消失』的坑会原样回来, 而且更隐蔽** (我已经把 TX 显式扣进判据并加了护栏, 但**护栏钉不住 payload 口径本身**, 因为\
    \ payload 根本不在脚本里)。\n  ★**建议**: 两处改成 **2986 / 1475 Mbps** (或直接引 PROJECT_TRACKER.md:2099 的口径), 并在 ISS-137\
    \ 脚本 §⑥ 旁注明 '以 §⑥ 为准'。★**另**: `HW/DISPLAY_MODULE_DECISION.md:102` 那条未闭合的未知项 '0.49\" 1920×1080 是**单色还是全彩**?'\
    \ ⇒ ★**它决定 TX 下限用的 bpp (24 vs 更低) ⇒ 直接决定 yolov5n 那 2.32ms 还剩多少** ⇒ 建议挂进面板问询单 (ISS-134/135)。\n  ★★**rev2\
    \ 复验补充: 落点实为 6 处 (比 rev1 数的 2 处多 4 处)** ⇒ ★**派 hw-lead 时请把这 6 处一起带上, 否则改完还漏** ★:\n    ① `HW/DISPLAY_MODULE_DECISION.md:53`\
    \ (373 Mbps / @90Hz ≈ 560) → **2986 / 4480**\n    ② `HW/STEP1_PARTS_SPEC.md:375` (246 / 373) → **1475\
    \ / 2986**\n    ③ ★**`HW/DEMO_BOARD_HW_DECISION.md:65`** (373 Mbps ⇒ 'demo 不需要 DSC') → **2986** ★**这处最要紧:\
    \ 它是 demo 板'不用 DSC'的决策依据**\n    ④ ★**`HW/PCB/WAVESHARE_2P8_INIT_AND_BACKLIGHT.md:398`** (373 Mbps\
    \ ⇒ '4-lane 完全够') → **2986**\n    ⑤ ★**`SW/DEMO_OD_PIPELINE_SPEC.md:322`** (373 Mbps / @90Hz ≈ 560)\
    \ → **2986 / 4480** ★**这处在 SW 分片 (我的), 但它是 ISS-145 (owner=sw-lead / verify_by=main) 的上游文件且已 fixed\
    \ ⇒ 我不擅自动 ⇒ 走 main 裁决**\n    ⑥ ★**`state/outbox/visionox_display_inquiry.md:29`** (373 Mbps ⇒ 拿去问面板厂'不用\
    \ DSC 能否跑满 60fps') → **2986** ★**★这处是对供应商的询价函草稿 ⇒ 数字错了会误导对方一个工程判断**\n  ★**★但请老板别被吓到: 我实算复核过结论方向不变**\
    \ —— 4-lane@2.5Gbps raw = 10 Gbps ⇒ @60Hz payload 2986 Mbps 只占 **29.9%** ⇒ ★**'不需要 DSC' 仍然成立** ⇒ 这\
    \ 6 处是'**数字错 + 依据虚**', 不是'结论错' ★ ⇒ ★**但依据虚到 8 倍, 下次有人拿它反推 TX 下限, 7.776ms 会塌成 ~0.97ms (我实算 7.776×3/24\
    \ = 0.972ms) ⇒ rev0 那个'显示 TX 从账上消失'的坑会原样回来, 而且更隐蔽** ⇒ ★**这仍不阻塞 ISS-137 签字 (payload 口径根本不在脚本里, 脚本 §⑥\
    \ 实打印 2986.0 Mbps 是对的)**。"
  since: '2026-11-11'

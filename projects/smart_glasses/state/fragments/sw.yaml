  text: 'A7S 封档项目里 cyl_iou_nms / cylindrical 0.40 阈值没带过来 —— 与锁死变量 #2 (80 类 COCO 不做场景定制) 冲突, 需项目总工裁决'
- id: SW-Q2
  to: main
  text: 显示帧率若降到 25-30fps, 老板的'60fps'锁死项是否要改写
risks:
- id: R-sw-step
  text: 'NPU 延迟台阶效应: 纯 NPU 跨过 16.67ms 边界 → age 从 2 跳 3 → 端到端直接多一整个帧周期 (67→83.7ms)。差 2ms 可能等于差 17ms'
  severity: high
- id: R-sw-fp32
  text: NPU 强制 FP32 输出 → 反量化占 SDK 总 25% (A733 实测 9.29ms) → 框龄跳档
  severity: high

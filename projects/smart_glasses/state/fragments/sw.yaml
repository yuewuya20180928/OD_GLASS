  ref: 'HANDOFF/2026-10-25_sw-lead_软件需求拆解.md#B4 + #接口请求(hw-lead) ; SW/SW_REQUIREMENTS.md#9.3 + #11.2'
- key: ntc_placement
  to: mech-lead
  value: '★10-27 ISS-090 更新 (NTC 已被 ISS-086 换成 TMP117, 测点由 SW 定): TMP117 装**镜脚主 PCB 的贴皮肤面一侧, SoC/电源级热源与皮肤接触面之间,
    投影距 SoC ≤10mm** —— 依据: 它对应 ISO 13732-1 43°C 红线唯一直接相关的部位; 皮肤是热沉 ⇒ T_PCB≥T_skin ⇒ 用它当皮肤代理是**保守方向** (宁可提前降载,
    不可漏判超温); 皮肤侧读数滞后是对的 (我们要限的是皮肤温度), 而**结温保护另找源** (SoC 片上温度传感器, 待 TBD-12)。不选 SoC die (TMP117 测不到 Tj),
    不选电池 (NTC→BQ25896 TS 已硬件停充, 重复且更慢)。软件约束: ① 四档皮肤口径 <38/<41/<43/>43°C (迟滞 2°C), 取代旧 4 档 70/85/95 结温口径
    ② 切档**执行**须 ≤1 帧 (16.67ms), 否则 frame age 跳档端到端 +16.67ms; **检测**延迟 ~1~3s (TMP117 1Hz + PCB 热惯性) 对皮肤暴露无意义
    ③ 读失败 3 周期 → 按 T2 降载 + 告警 (I2C_A 与 camera 跨铰链同总线, camera 卡死会致盲温度保护) ④ 首读 -256°C 必须丢弃。实测功耗仍待投板。'
  ref: SW/SW_TIMING_REVIEW.md + HANDOFF/2026-10-27_sw-lead_时序交叉评审.md (ISS-090, 2026-10-27)

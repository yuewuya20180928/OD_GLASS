answers:
- key: debug_port_form
  to: hw-lead
  value: 调试口=Type-C USB2.0 (ADB over USB + CDC-ACM 串口共用一个口, 依赖 SoC USB Device PHY); OD 是连续推理 100% 占空比、无空闲窗口
    -> DC-DC 瞬态与去耦电容请按连续满载设计, 不要按平均功耗x占空比; 分段负载曲线口径见 SW §11.2 (实测待投板)
  ref: 'HANDOFF/2026-10-25_sw-lead_软件需求拆解.md#B4 + #接口请求(hw-lead) ; SW/SW_REQUIREMENTS.md#9.3 + #11.2'
- key: ntc_placement
  to: mech-lead
  value: '软件只读 SoC 结温(Tj), 粒度>=1Hz; NTC 贴 SoC 背面或金属骨架, 不贴皮肤侧 (皮肤侧读数滞后会让降频滞后); 接受你 §2.5 的 4 档温控表, 加软件约束:
    切档须在 1 帧周期 16.67ms 内完成, 否则 age 跳档端到端 +16.67ms; 实测功耗待投板, 按需vs持续待 Q4'
  ref: 'HANDOFF/2026-10-25_sw-lead_软件需求拆解.md#B4 + #接口请求(mech-lead) ; SW/SW_REQUIREMENTS.md#8.2'
interface_claims:
- key: latency_budget
  value: 口径A:55.7/67.0/83.7ms,口径C:42.3/50.3ms
  note: 模式A 显示 25.6fps / 模式B age=2 / 模式B' age=3 / 模式C 需 T_od<=16.67ms; 全部为推算
- key: od_input_size
  value: 640x640
  note: letterbox; 建议 INT8 输出直通 (自反量化 0.1-0.3ms 而非 SDK 9.29ms)
- key: memory_budget
  value: 202-215MB/512MB
  note: R7 降级为低; 待确认 NPU SDK workspace + CMA 预留策略; ★10-27 同步 ISS-071 重算后的文档值 (原 178-191MB 是重算前的旧数); 与
    memory_budget_recomputed 差 ~2.7-1.4MB
- key: memory_budget_recomputed
  value: 199-216MB/512MB
  note: 'SW §12.1 表行逐行相加 (10-27 重算: 乐观 199.3MB / 悲观 216.4MB); 与表头 ~202/~215MB 差 ~2.7MB (ISS-071 之前就存在的缺口,
    非本轮引入); 显示帧buffer行无重复计入 (原''疑似重复计入''假设已排除); 结论不变 (占 39-42%, 非瓶颈)'
- key: display_frame_rate
  value: 60fps
  note: 现状 age=2 -> 67ms; 若 25-30fps -> 55.7ms 达标
- key: od_duty_cycle
  value: 100%
  note: OD 连续推理, 无空闲窗口; DC-DC 瞬态/去耦按连续满载设计 (SW §6.1 + §11.2)
- key: debug_port_iface
  value: USB2.0-ADB+CDC
  note: 'Type-C 复合设备: ADB 走 bulk + CDC 走日志; 依赖 SoC USB Device PHY (未确认)'
- key: od_segment_budget_ms
  value: pre1/npu16/quant2/nms3/draw1
  note: S4-S8 分段预算; 打点口径 SW §11.2, 实测待投板
- key: box_age_frames
  value: '2'
  note: age=ceil(T_od/16.67); T_od>16.67ms 即跳到3 -> 端到端 67->83.7ms
- key: thermal_control_tiers
  value: 4档 <70/70-85/85-95/>95C
  note: SoC 结温(Tj)档位, 来自 MECH_BUDGET §2.5; 皮肤温度验收归 mech-lead; 切档须<=16.67ms
- key: thermal_sensor_iface
  value: I2C-NTC+1Hz
  note: 软件只读 SoC Tj; NTC 贴 SoC 背面/金属骨架, 不贴皮肤侧
- key: flash_link_layers
  value: L-A:USB-DL / L-B:ADB+CDC
  note: 两条物理路径共用同一个 Type-C 口; L-A=量产/救烧(BOOT 模式+厂商下载工具); L-B=日常升级(ADB push, 目标<2min); 依赖 ARS45 USB Device
    PHY (未确认)
  ref: SW/FLASH_AND_VERSION.md#B4
- key: flash_storage_model
  value: ro_rootfs+ab_app_model
  note: '条件式推荐: rootfs 只读 squashfs + app/model A/B 双槽; 条件 rootfs<=30MB; 不做 rootfs 级 A/B (需 eMMC -> 板宽
    12->15mm, 结构冲突); 推算'
  ref: SW/FLASH_AND_VERSION.md#B4
- key: fw_version_fields
  value: boot/kern/rootfs/app/model/isp
  note: 6 项必录, 缺一报 E_VER_INCOMPLETE; 与 EVT 报告头 5 项一致 + 新增 isp 参数集版本
  ref: SW/FLASH_AND_VERSION.md#B4
- key: fw_version_format
  value: ARS45-SW semver+gitsha8
  note: MAJOR=分区/启动接口变; MINOR=新功能; PATCH=修缺陷; PRERELEASE 禁入产线; 版本串落 3 处 (/etc/version + flash 版本块 + 屏幕)
  ref: SW/FLASH_AND_VERSION.md#B4
- key: rollback_levels
  value: L1:ab-slot-switch / L2:full-reflash
  note: L1=push 旧版到备用槽+重启 (<=30s, 不刷 rootfs); L2=插线用厂商下载工具重刷出厂镜像 (无 OTA, 唯一兜底); 锁死#11 不上无线是前提
  ref: SW/FLASH_AND_VERSION.md#B4
- key: brick_rescue_levels
  value: S1-wd/S2-dl/S3-jtag/S4-reflow
  note: S1=软件自恢复(watchdog+systemd); S2=BOOT+厂商下载工具 / S3=JTAG, 两者均依赖原厂未确认工具链; S4=返厂换件; 量产前必须实测走通 S2
  ref: SW/FLASH_AND_VERSION.md#B4
- key: flash_prod_mode
  value: adbd-off/fastboot-off
  note: prod 模式关 adbd 与 fastboot (USB 是唯一物理攻击面); service 模式仅返修工位开; 开关位在版本块, 与版本串原子写
  ref: SW/FLASH_AND_VERSION.md#B4
- key: s2_boot_entry_methods
  value: A:boot-pin+reset / B:key-combo / C:usb-trigger
  note: 进 BOOT 的 3 种方式 (SW/FLASH_AND_VERSION §4.5.2.2); 推荐 A (跳线+RESET, 不依赖 bootloader 按键逻辑); B 不得复用侧键
    (售后已占 长按3s=版本号 / 长按10s=关机, FRAMEWORK/AFTERSALES §2); t1~t4 具体数值待原厂 (P1)
  ref: SW/FLASH_AND_VERSION.md#4.5.2
- key: s2_rescue_checklist
  value: CB-01..CB-09 / BR-01..BR-12
  note: §4.5.4 的 9 条机械校验判据 + §4.5.6 的 12 条用例; BR-01 判过 = CB-01~09 全过; 与 EVT_TEMPLATE §11 一一对应; 板端全部 [待实测]
  ref: SW/FLASH_AND_VERSION.md#4.5.4 + SW/EVT_TEMPLATE.md#11
- key: flash_capacity_floor
  value: 128MB-NOR-min
  note: '★新约束 (10-27): §4.1 推荐C的分区表总量 90MB (rootfs30+model15x2+app8x2+kernel8+boot1+isp1) → 64MB SPI-NOR
    装不下; 真实条件 = rootfs<=30MB 且 flash>=128MB; 若硬件只给64MB 则 A/B 槽必须缩; 证据 [实测](布局检查器 --device-size 64MB →
    LAY-03/04 FAIL) + [推算](分区大小)'
  ref: SW/FLASH_AND_VERSION.md#4.5.1
- key: display_resolution
  value: 800x600
  note: '老板锁死的显示分辨率 (PROJECT_TRACKER §0 变量 23/27, 10-21 锁定; 光机 JBD 走鹃Ⅱ 原生同为 800×600); 源数据 = OD 640×480
    上采样 x1.25 (ISS-061 锁定链路)。SW §12.1 的''显示帧 buffer''与''合成帧''两行按此算, 不按 640×480 重算 (项目总工 ISS-073 裁决 2026-10-26);
    证据: 决策文本·项目总工裁决 + 官方(光机规格)'
  ref: SW/SW_REQUIREMENTS.md#12.1
- key: model_asset_id_scheme
  value: MOD-<FAMILY>-<VER>-<RES>
  note: 模型唯一 ID 规则 (例 MOD-YOLOV5S-320-INT8); 版本只认 sha256[:16], 不认文件名 —— 依据 [实测] 三份同名 yolov5s-sim sha256
    互不相同且 clean/v2 两份逐字节相同 (输入 320/320/640)
  ref: SW/MODEL_ASSETS.md#1.1
- key: model_asset_slot_budget
  value: 15MiB
  note: 板端 model_a/model_b 单槽上限 = 15,728,640 B; 来源 FLASH_AND_VERSION §4.1 + s2_rescue_config.example.json;
    只管板端产物, 不管 PC 侧 ONNX; 与 flash_capacity_floor=128MB-NOR-min 是同一条容量线的两半
  ref: SW/MODEL_ASSETS.md#1.6
- key: model_asset_registry_tool
  value: SW/tools/model_asset_check.py
  note: 台账机器复核入口; rc=0 = 台账与实物一致 (不等于可量产, 量产看 L 计数)
  ref: SW/MODEL_ASSETS.md#7
- key: model_asset_release_gate
  value: L=0
  note: '量产放行判据: 放行阻断项计数必须 0 — L1 许可[0数据] / L2 超 15MiB 槽 / L3 chip ID 不符 / L4 AGPL 商用受限; 当前 L=2 (L1 yolov5s-sim
    许可未知 + L4 yolov8s AGPL-3.0)'
  ref: SW/MODEL_ASSETS.md#1.5
- key: model_version_string_fmt
  value: yolov5s-int8-ag2-<sha8>
  note: 与 FLASH_AND_VERSION §2.5.1 一致, 不改; <sha8> = 板端模型文件 sha256 前 8 位; <ag2> = 板端格式版本, 必填 (A7S NBG format
    version 坑); 换格式版本必须换版本串
  ref: SW/MODEL_ASSETS.md#4.3
- key: model_calib_min_images
  value: '100'
  note: INT8 校准集最少张数 (A733 实测 6 张不够用); 现有 100 张 = COCO 通用集, 与眼镜场景分布不符, 需自建
  ref: SW/MODEL_ASSETS.md#2.4
- key: model_quant_scheme
  value: pcq
  note: A733 侧真正 INT8 的量化方案名 (per-channel symmetric affine); Art.Galaxy 侧方案名 [0数据] (Q9 追加第 3 条); .quantize
    量化参数表本身是资产, 换参数=换模型
  ref: SW/MODEL_ASSETS.md#2.3
- key: model_regression_gate
  value: R-01..R-14
  note: 模型变更后必跑的回归用例编号集合 (台账/许可/文件头/容量/加载/数值/量化器/总体精度/逐类精度/阈值/性能/端到端/版本串/刷写回滚), 全过才允许刷板; 与 BR-01..BR-12
    不重叠 (一个测模型, 一个测刷写救砖)
  ref: SW/MODEL_ASSETS.md#4.2

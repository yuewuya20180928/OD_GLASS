  to: main
  item: '★★本条内容已按 2026-11-11 21:2x 实测订正 (原「本机 python3.14 无 numpy 且装不上」的前提**已不成立**)


    ★★**[实测] numpy 已恢复**: 本机 `python3 -c "import numpy; print(numpy.__version__)"` ⇒ **numpy 2.5.4** (python3
    3.14.4) ⇒ `python3 MECH/dfm_check.py` **rc=0** (面级统计脚本**能跑**) + `python3 MECH/print/verify_pack_revb.py`
    **rc=0** (**尺寸判据 93/93 一致 + STL↔解析模型逐点互验 38/38 点一致**) ⇒ **本条的「numpy 缺失」阻塞已消除, 不再是活阻塞**。


    ★★**但真正的剩余阻塞不是 numpy, 是【量产外形件模型还没做】**: Rev B 打印包是**检具 + 试样** (`MECH/print/temple_cage_revb.stl` 镜脚内腔检具
    60×122.40×27.80 / `fit_coupon_revb.stl` 配合标定件 150×132×22 / `frame_typec_coupon_revb.stl` 面板试样 33×3×7.20)
    ⇒ **不含量产外壳件** ⇒ **量产外壳的脱模面级统计仍 0 个数据点** (**[0数据]**: 无量产外形件模型 ⇒ 脱模/分型/收缩/缩痕/飞边/顶针的面数统计**无对象可数**)。


    ★**这条的未决性质已变 (内容不变, 状态变)**: 原问题 = 「本机装不上 numpy ⇒ 打印包自检复现不了」 ⇒ 现在 = 「**打印包自检可复现了, 但它只能证明 Rev B 检具/试样自身,
    不能证明量产外壳能不能脱模**」 ⇒ **本条应转成「量产外形件模型 (给模具厂/给 DFM 面级统计用) 什么时候做、谁做」的问题**, 而不是环境问题。


    ★**结构侧已备好的材料 (不需再问 numpy)**: `MECH/dfm_check.py` rc=0 已跑出 Rev B 几何的 **ZERO_DRAFT 面占 25-62%** (直壁)
    + `fit_coupon` 另有 **2 个倒扣面 (α=−40°/−30°)** ⇒ **FDM 能打, 注塑/压铸出不来**; 脱模侧主腔深 38.00 双面 1° ⇒ 镜脚·H 链 (电芯段)
    最坏 **0.75 − 1.327 = −0.577mm ⇒ 几何上做不出来** ⇒ 必须靠**结构改 (换拉出方向)**, 不能靠公差改 ⇒ 结构侧已交解法 `MECH/ISS127_H_CHAIN_SOLUTION.md`
    §C.1 **P1 = 镜腿壳体 H 向分型 (皮肤盖 + 内胆)** (链① Δ_H=0 ⇒ 三档 α 全过 0.40)。


    ★**要 main 回答的 (收敛成 1 条)**: **量产外形件 (量产外壳) 模型由谁做、何时给** —— 这是本条**现在唯一的剩余阻塞**; numpy / python 版本 / 脚本依赖**已不再是阻塞**。〔见
    `HANDOFF/2026-11-11_mech-lead_ISS197_口径收敛与未决项选项表.md`〕'

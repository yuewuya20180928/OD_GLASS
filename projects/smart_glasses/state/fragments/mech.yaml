  ref: MECH/fit_check.py + HANDOFF/2026-10-25_mech-lead_空间预算.md#B2-16
- key: ntc_placement
  to: sw-lead
  value: '结构侧本轮新增硬约束 (会限制你的 DVFS 散热方案): 镜脚前后厚余量只有 0.30mm → 导热垫 (0.3mm) 与金属骨架 (厚度 v1.1 未给, 我按 1.0mm 假设)
    都加不厚; 若你要求更厚的骨架/更多散热面积来压结温, 必须同步把镜腿前后厚从 7.3 加到 7.6-7.8mm (华为 6.25 基准会进一步被突破, 需老板拍板形态)。另外: 持续满载 1.22W
    → 皮肤侧推算 96.1/82.0°C, 43°C 红线只允许贴皮肤镜腿持续 0.16-0.21W, 这个数字没变, 降温只能靠降功耗不能靠加散热片'
  ref: MECH/fit_check.py + MECH/MECH_BUDGET.md#2.3.1
interface_claims:
- key: pcb_outline
  value: 50x12mm
  note: 镜脚截面随电池档位 7.3/8.7/11.2mm; 板宽跟 FCCSP pitch 走 (pitch<=0.3mm -> 15mm, 投板前必须 close); 与 hw-lead/main
    同值
  ref: MECH/MECH_BUDGET.md#5.1
- key: pcb_thickness
  value: 0.8mm(4层)/1.0mm(6层)
  note: 锁死 4-6 层; 4层=0.8mm / 6层=1.0mm; 阻抗控 MIPI 走线
  ref: MECH/MECH_BUDGET.md#5.1
- key: pcb_mounting
  value: 2xM1.2+1x⌀2.0H7
  note: 孔心到板边 2.5mm; 定位靠金属骨架不靠打印面 (FDM 打不出 H7); 器件距板边>=0.8mm
  ref: MECH/MECH_BUDGET.md#5.1
- key: battery_capacity_tier
  value: 无桥接340-575mAh/有桥接575-675mAh
  note: 675mAh 形态否决 (镜腿 11.2mm = 华为 6.25mm 的 1.8 倍); 与 hw-lead/main 同值
  ref: MECH/MECH_BUDGET.md#1.6.2
- key: temple_thickness
  value: 7.3-8.7mm
  note: 340mAh 档 7.3mm / 575mAh 档 8.7mm; 675mAh 档 11.2mm 已否决; 华为镜腿 6.25mm 基准
  ref: MECH/MECH_BUDGET.md#1.6.2
- key: temple_cavity_length
  value: ≥110mm
  note: 充电板挪出镜脚后的长度需求 (105.5/110/108mm); 130mm 内腔基准; 镜腿根部净高>=38mm
  ref: 'MECH/MECH_BUDGET.md#1.4.2 + #1.6.3'
- key: typec_opening
  value: 9.5x3.6mm
  note: 母座本体 8.94x3.26; 末端壁厚留>=1.5mm 承力 + 铝框防刮; 受 P2S FDM 公差限制; 与 hw-lead 同值
  ref: MECH/MECH_BUDGET.md#5.1
- key: skin_temp_limit
  value: 38-40C(红线43C)
  note: ISO 13732-1 / CENELEC Guide 29 (8h 及以上接触全部材质 43°C); 皮肤温度测量与验收归 mech-lead; 与 main 同值
  ref: MECH/MECH_BUDGET.md#2.2
- key: skin_sustainable_power
  value: 0.16-0.21W
  note: 43°C 红线对应的贴皮肤镜腿持续功耗上限 (主模型 0.16W / 壳壁剥离变体 0.21W); 1.22W 持续满载 -> 皮肤侧 96.1/82.0°C
  ref: 'MECH/MECH_BUDGET.md#2.3 + #2.3.1'
- key: thermal_control_tiers
  value: 4档 <70/70-85/85-95/>95C
  note: SoC 结温(Tj)档位, 不是皮肤温度; 皮肤侧无传感器; 切档须<=16.67ms; 与 sw-lead 同值
  ref: MECH/MECH_BUDGET.md#2.5
- key: camera_window
  value: 俯角20-32度/FOV>=100度/边框凹进<=1.5mm
  note: 装镜框上沿的俯角偏置不可回避; 凹进5mm 吃掉上半视场31%; 镜框上沿需局部加厚10-12mm; 凸出1mm 俯角+0.7~0.8度
  ref: MECH/MECH_BUDGET.md#1.5.2
- key: camera_fov_16x9
  value: 对角100度→H92.2/V60.6
  note: 16:9 sensor 分解; 边框遮挡后实际可用视场更小; 对角110度→H102.4/V70.0, 120度→H113.0/V80.7
  ref: MECH/MECH_BUDGET.md#1.5.1
- key: splitter_volume
  value: 0.79cc
  note: 一拖二分光组件 (平板10x10x1.5 + 2棱镜8x8x5), 比光机本体 0.18cc 大 4 倍; 全推算, JBD 无成品
  ref: MECH/MECH_BUDGET.md#1.2
- key: splitter_mount_tolerance
  value: ≤0.25度/0.175mm@40mm
  note: 分光件必须与光机共基准 (不能各自胶粘); 分光面需<=5µm 加工件, 不能用打印面 (FDM Ra 10-30µm)
  ref: 'MECH/MECH_BUDGET.md#1.2 + #5.2'
- key: optical_cavity_size
  value: 14x10x6mm
  note: 镜框正中光学舱 (光机+分光件串联); 镜框正中厚需>=11.8mm; 双光机 Plan B 只需 4.8mm
  ref: MECH/MECH_BUDGET.md#1.4.5
- key: waveguide_slot_parallel
  value: ±0.3度
  note: U形卡槽面内平行度; 泡棉软压不硬压 (防装配应力彩虹纹); 平行度由金属压条保证不靠打印面
  ref: 'MECH/MECH_BUDGET.md#4(d) + #5.2'
- key: p2s_min_wall
  value: 0.8mm
  note: P2S 0.4 喷嘴 4 圈; 受力肋>=1.2mm; 螺钉柱>=2.4mm 直径; 装配间隙 单边 0.15-0.3mm
  ref: MECH/MECH_BUDGET.md#5.4
- key: p2s_overhang
  value: ≤45deg
  note: 目标 0 支撑; >60deg 必须拆件; PA-CF 层间结合 50-60% -> 受力必须在 XY 平面内
  ref: MECH/MECH_BUDGET.md#5.4
- key: temple_h_stack
  value: 7.00mm(340档)
  note: 镜脚电池区前后需求 = 下壳壁0.8 + 电池4.6 + 隔热垫0.5 + 空气隙0.3 + 上壳顶壁0.8; 可用 7.3 (§1.6.2) → 余 0.30mm; PCB/骨架区 4.50-4.70mm;
    设计态计算, 非实物实测
  ref: MECH/fit_check.py
- key: temple_h_margin
  value: 0.30mm
  note: 前后余量, 与 FDM 单边公差 ±0.2-0.3mm 同量级 → 临界; 建议镜腿 7.6-7.8mm; 若按 §1.4.2 叠层模型则干涉 0.80mm (v1.1 两模型并存, 需锁定)
  ref: MECH/fit_check.py
- key: tail_section_width
  value: ≥12.5mm
  note: 镜腿尾端截面宽下限 (Type-C 开口 9.5 + 两侧 1.5 承力壁); 高度 ≥6.6mm (可用 7.3, 余 0.7); 末端宽度 v1.1 未定义 (u8) → 需老板/PM
    定镜腿形态
  ref: MECH/fit_check.py
- key: mfit_scope
  value: 镜脚侧通过(临界)/镜框侧未验
  note: 'M-FIT 设计态结论 (MECH/fit_check.py): 镜脚侧 340mAh 档条件通过; 3 项条件性不通过已量化 (叠层模型 +0.80/+3.50mm, 充电板不移出 +0.50mm,
    ⌀2.0H7 FDM 做不到); 镜框侧缺 JBD 走鹃Ⅱ尺寸(u1)+波导2D图(u4)+镜框形态(u8)'
  ref: MECH/fit_check.py
- key: print_pack
  value: MECH/print/*.stl
  note: 可下片 STL (fit_coupon_340 + temple_cage_340) + MEASURE_CHECKLIST.md (41 项测量清单) + verify_pack.py
    (模型级 41/41) 已交付; M-PRINT 仍 0 实测 (本机不可打印/量测, 已升级 boss)
  ref: MECH/fit_check.py
open_questions:
- id: MECH-Q1
  to: main
  text: 675mAh 形态否决的兜底方案 (拆左右镜脚分摊电池) 是否走? 还是靠 Q4 口径把电池压下来
risks:
- id: R-mech-heat
  text: 持续满载 1.22W 与'眼镜贴皮肤佩戴'热学上不相容 (差 6-8 倍)。出路是降功耗不是加散热片
  severity: high
- id: R-mech-thickness
  text: '电池容量直接决定镜腿厚度: 340→7.3mm / 575→8.7mm / 675→11.2mm (华为 6.25mm 的 1.8 倍, 形态否决)'
  severity: high
- id: R-mech-splitter
  text: 'R13 分光件自研: 必须与光机共基准 (0.25°→40mm 臂长 0.175mm), 分光面需 ≤5µm 而 FDM 是 Ra 10-30µm → Plan B 双光机在结构上比一拖二更简单'
  severity: high
- id: R-mech-chargeboard
  text: 充电板只 0.2cc 但吃 25mm 长度, 是镜脚长度超标唯一元凶 → 必须挪出镜脚
  severity: medium

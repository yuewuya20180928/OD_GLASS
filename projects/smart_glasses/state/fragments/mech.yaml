    + 上壳顶壁0.8) vs 可用 7.30 → 余 0.30mm, 与 FDM 单边公差 ±0.2-0.3 同量级 → 临界, 建议镜腿做到 7.6-7.8mm; PCB/骨架区仅 4.50mm
    (4层) / 4.70mm (6层) → 板厚 4层/6层 都不卡空间 (但若按 §1.4.2 ''电池与PCB同区叠放'' 模型 → 前后干涉 0.80mm + 垂直干涉 3.50mm, v1.1
    两个排列模型必须锁定一个); 长度: 电池40.5 + PCB50 + 余量15 = 105.5 ≤ 130 (充电板必须挪出镜脚, 否则 +0.50mm 干涉); Type-C 尾端截面宽需 ≥12.5mm
    (开口9.5 + 两侧1.5 承力壁)、高需 ≥6.6mm (可用7.3, 余0.7)'
  ref: MECH/fit_check.py + HANDOFF/2026-10-25_mech-lead_空间预算.md#B2-16
- key: ntc_placement
  to: sw-lead
  value: '结构侧本轮新增硬约束 (会限制你的 DVFS 散热方案): 镜脚前后厚余量只有 0.30mm → 导热垫 (0.3mm) 与金属骨架 (厚度 v1.1 未给, 我按 1.0mm 假设)
    都加不厚; 若你要求更厚的骨架/更多散热面积来压结温, 必须同步把镜腿前后厚从 7.3 加到 7.6-7.8mm (华为 6.25 基准会进一步被突破, 需老板拍板形态)。另外: 持续满载 1.22W
    → 皮肤侧推算 96.1/82.0°C, 43°C 红线只允许贴皮肤镜腿持续 0.16-0.21W, 这个数字没变, 降温只能靠降功耗不能靠加散热片'
  ref: MECH/fit_check.py + MECH/MECH_BUDGET.md#2.3.1
- key: rel_mount_stiffness
  to: hw-lead
  value: '面接触。① 金属骨架托架沿 PCB 长边托住, 接触面 >=40x8mm (有效跨距约3mm) -> 板弯 sigma≈17MPa, 满足 <=板材许用x0.5 (50-70MPa);
    2xM1.2 螺钉只做防翘压紧, ⌀2.0H7 定位销只防转, 均不承担弯矩。② 承力面必须是金属骨架/机加工件, 不是 P2S 打印面 (FDM ±0.2-0.3mm 打不出 H7, 且打印层纹垂直受力方向会层间剥离)。③
    PCB 不进铰链弯折区: 弯折全部由跨铰链 FPC 承担 (R>=3.0mm), 故 PCB 与焊点弯折应力≈0, MLCC 陶瓷开裂风险归零。④ 跌落 10 次后用同一块板的 3 个位置 (FCCSP/BTB/电感)
    X-ray + 1 处切片复核。 [推算-设计承诺, 未实测] 依据: MECH/MECH_BUDGET.md §1.3 M1 + §5.5, MECH/RELIABILITY_TEST_PLAN.md
    §B12 K-8 / §B5 T-01'
  ref: MECH/RELIABILITY_TEST_PLAN.md#b12 + MECH/MECH_BUDGET.md §1.3 M1
- key: emc_mech_interface_ask
  to: main
  value: 'D8 跨铰链走线长度预算(mm, 框内+铰链+脚内): CSI 102-144 / DSI 87-129 / USB 42-84 / 电源 27-59 (铰链段=90°弧长4.71+间隙2-4);
    D9 互连形式: 充电板↔主板 = 1×8@0.5mm 跨铰链 FPC (SYS×2/检测×2/状态×2/GND×2, 电池在镜脚则 10p 扛 1.5A) + 独立 4p@0.5mm USB 差分
    FPC (>=4层, 90Ω±10%, 全 0.5mm pitch), 全 0.5mm pitch (1.27mm FFC 达不到 R3.0 弯折寿命); D7 只能答一半: 5 类金属件与 FPC
    间距 (骨架>=3.0mm/Type-C 屏蔽壳>=3.0mm/铰链件>=0.5mm/PCB 定位销>=0.5mm/充电板铝罩), 建议屏蔽壳+骨架单点接地, 但 ''外露金属件'' 定义与活动铰链能否做全单点接地需
    EMC 给口径 (已发需求)'
  ref: 'MECH/USB_HINGE_STRUCTURE.md#3.3 + #4.5 + #5.3'
- key: iss049_hole_windows
  to: hw-lead
  value: '铰链端4条跨铰链连接器(54触点@0.5mm)的X占位算完了(ISS-089本单补上你ISS-105 F-2那栏''没人算过''的): 4座沿板长排开需25.70mm (3x座体进深6.40
    + 1x4p的5.00 + 3x间隔0.50), 但铰链端可用X只有19.70mm (板边0.50到SoC逃线带起点X=20.20) => 缺6.00mm, 且固定孔X=5.00与X=15.00正好落在这一段里;
    单个座Y向放得下(最宽CONN_LIGHT 12.50 vs 板宽15.00余2.50)但4座不能沿Y并排; 我的建议(不是拍板): 合并CONN_USB(4p)+CONN_CAM(18p)成一个22p座
    => 3座需19.30mm刚好塞进19.70, 但要先由你判USB 90欧与CSI 100欧两种阻抗同FPC的可行性; 另一条路是SoC逃线带起点后移或板长加到66mm; 注意: 走线拓扑建议按H向径向嵌套
    (V向叠放则4条带宽31.00mm远大于板宽15.00mm, 4座不能同面)'
  ref: MECH/HW_CROSS_REVIEW.md §2.3/§2.4/§5 R-1
- key: iss105_pcb_outline_sync_60x15
  to: hw-lead
  value: '已同步: mech.yaml 的 pcb_outline 从 50x15mm 改成 60x15mm (板宽15不变), pcb_outline 冲突即消。另: 你的 pcb_mounting
    写 ''PIN-SET-2:2x⌀2.0H7+2x⌀1.4'' 与你自己 ISS-105 定版的 HW/PCB_OUTLINE_60x15.md §0-2 (2xM1.2⌀1.4 + 1x⌀2.0H7,
    3孔) 不一致, 合并器报的 pcb_mounting 冲突是这个, 请按你 ISS-105 定版那版改; 我这边的值已按 ISS-105 定版保持 (2xM1.2 + 1x⌀2.0H7)。再:
    ISS-089本单发现两条会打回重画的结构侧问题, 建议一并处理: (1) 充电灯 D_CHG_LED/Q_CHG_LED/R_CHG_LED 的 board 列标成 MAIN_PCB, 但同页注记写''装在充电板(镜框)靠近Type-C座''
    而 VBUS_5V_CHG 只存在于充电板 => board列标错, BOM备料/装配/ISS-103导光孔位置会跟着做错; (2) CHARGE_BOARD_SPEC §3.4 的 ICHG=0.822xIIN
    方向反了 (buck功率守恒应为1.216), 390欧档的单pin电流要重算'
  ref: MECH/HW_CROSS_REVIEW.md §2.4/§5 R-7/R-9/§6 自-3/自-6
- key: sw_temp_mount_point
  to: sw-lead
  value: '结构侧答: (1) TMP117 贴装落点建议放镜脚主PCB的贴皮肤面一侧、SoC投影<=10mm范围内, 用0402/0603贴PCB背面(非皮肤面)并用0.3mm导热垫连到骨架,
    不直接贴皮肤面(皮肤侧读数滞后会让降频滞后=反而更热), 与NTC同策略; (2) 金属骨架/石墨与镜脚PCB的热隔离边界: 骨架止于PCB段后缘(不延伸进电池段), 石墨只做面内扩展不跨隔热垫,
    两者前端(Z<0)默认不延伸进铰链端余量区; 隔热垫0.5mm+空气隙0.3mm是皮肤侧热路, TMP117若在骨架正下方会被烤热 => 建议TMP117与骨架水平距离>=8mm; (3) 光机(镜框正中鼻梁上方)温度遥测:
    结构侧无独立器件位(镜框正中已被光机+分光件占11.8mm厚), 若要监控只能靠镜框上沿或端件的器件位, 需JBD接口定义 => 属[0数据], 不拍板'
  ref: MECH_BUDGET §5.1/§2.5 + MECH/HW_CROSS_REVIEW.md §7.3

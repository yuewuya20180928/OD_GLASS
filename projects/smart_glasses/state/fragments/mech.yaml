    (8,15)/(52,15), ⌀1.6 @(12,94)/(56,104) ⇒ **(8,10)/(52,20) = 套 A** ⇒ **若 PCB 按套 B 钻, M1.2 螺钉与笼的 ⌀1.6
    让过孔差 7.50mm ⇒ 螺钉穿实心板 ⇒ 板装不进骨架/笼**;


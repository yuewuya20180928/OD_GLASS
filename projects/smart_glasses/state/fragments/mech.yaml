  item: '★石墨裁剪 (预算裁): ISS-127 推荐方案 P1 的重量账**净减 0.38 g/对**的唯一来源 = 石墨从满板 (60×30×0.30 = 0.54cc × 2.00 × 2
    = **2.16 g/对**, 超 W11 1~2g 的 0.16) 裁到 **SoC 段 + X 向逃线带 5.00/边 (27.20×30×0.30 = 0.2448cc ⇒ 0.98 g/对**)
    —— 依据: 30mm 板宽下骨架候选 C 的 SoC 段**满宽 30.00**, 横向扩散通道 6.95mm/边 ⇒ 石墨的横向面内扩散功能已被满宽铝骨架覆盖, 石墨只铺 SoC 段即可。与本人
    ISS-192 交卷 (2026-11-11 17:39) 的"要么缩石墨覆盖 (只铺 SoC 段+扩散带), 要么调 W11 预算"同源。影响: P1 金属+石墨合计 5.86 g/对 vs 基线
    6.24 ⇒ 净减; 骨架本身 4.08 g/对 仍超 +1~3g 预算 1.08 (ISS-192 结论, 本单不动)。假设: 按裁剪推进。详见 MECH/ISS127_H_CHAIN_SOLUTION.md
    §C.1 重量表。'
  since: '2026-11-11'
- key: mech_iss127_graphite_in_hchain
  to: main
  item: '★石墨在链② (PCB/骨架堆叠 H 链) 里的位置口径要钉死: 是**挤占**链② 里的 0.30 空气隙, 还是**叠加**在 4.40 之外? 现状两处文档不一致: BOARD_GEOM_30MM
    §5.4 写 "4.40 vs 7.30 ⇒ 余 2.60" (= 4.70 含石墨口径, 但同句又写 4.40 ⇒ 2.60, 差 0.30); skeleton_section_check.py
    §4 写 "骨架1.0+石墨0.30 ⇒ 4.70 ⇒ 余 2.60"。本单按**叠加 (保守)** 计算 ⇒ 链② 在 α=1.5° + 含石墨 + 板厚 1.22 ⇒ 量产最坏 **0.190
    < 0.40 破线** (这 0.190 是本单查出的新问题: DFM 评审只核过链① 从没按 0.40 判据核过链②)。若改为挤占口径 ⇒ 同格 0.490 ✅ 不破。⇒ 请 main 会同 hw-lead
    钉死 (挤占 or 叠加), 这决定 ISS-127 的链② 是否需要额外动作。注: 无论怎么钉, P1 (H 向分型) 下链② 的脱模项 = 0 ⇒ 四档全过 (2.99/2.60/2.40/2.18
    含石墨口径)。'
  since: '2026-11-11'

- key: iss222_mech_c7b_sink_is_metal_not_print
  to: main
  item: '★C-7b (ISS-222 本轮新查出的冲突, 只报不改): ISS-219 的 P3 把 镜框上沿 120×30 打印件顶面 当成与铝条同温的集热面 (口径内算得 46.63 °C
    ✅), 但打印件 PA-CF k=0.2 沿上沿方向的热阻是 3610 K/W (70 mm 段, 96.96 mm² 截面) ⇒ 远离铝条的部分几乎不参与散热 ⇒ 顶面有效热导 R = 398.9
    K/W vs 同面积直接对流 47.6 K/W (差 8.4 倍) ⇒ 实算腔体 53.60 °C ❌ (超 50 °C 红线 3.60 °C, d=15 u8=30) ⇒ 降级路径 (a) 铝制集热背板
    120×30×1.0 不是可选降级, 是 P3 成立的必要条件 (装上: 47.77 °C @0.468 W / 48.65 @0.50 W ✅, P_max 0.5496 W, +9.72 g
    = 2.70 mg/mm²); (c) 端件整条金属化 11.34-22.68 g 换 600-800 mm² = 14.18-37.80 mg/mm² (贵 5.3-14.0 倍且面积仍差 3-7
    倍, 腔体 61.64-64.60 °C ❌) ⇒ 不可接受 (有数); (b) 面板降到 0.415 W 时打印件方案仍 51.49 °C ❌ ⇒ 必须与 (a) 同做 ⇒ 请裁集热面做成什么材质

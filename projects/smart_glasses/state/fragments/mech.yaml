    (再 +800-1200mm²); (c) 面板功耗降到 ≤0.415W (SW/老板决策, P3 的 P_max=0.604W ⇒ 468mW 只余 +29%); (d) 改整机形态。★数字依据:
    d=15 档集热面需求 ≈2628mm² (P3) / ≈4175mm² (P1), 现状端件只有 600-800mm²; P3 达标时腔体 45.95-46.63C @0.468W / 46.70-47.43C
    @0.50W。★u8 只占集热面 14.3-18.2% ⇒ **u8 未定不阻塞本条**, 但 u8 一落定仍请按 MECH/ENDPOINT_METAL_PATH_MASS_TEMPLATE.md

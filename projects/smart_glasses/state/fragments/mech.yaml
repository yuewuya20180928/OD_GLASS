- key: iss134_mech_boss_decide_waveguide_vendor_and_fov
  to: main
  since: '2026-11-15'
  item: '★ISS-134 待老板拍的那一维 = 波导归属 (选谁 / 是否与光引擎打包 / 单台样机是否走公开采购而非 JBD 问询)。★我不替老板定, 只列 3 个候选 + 取舍 + 建议:
    A 舜宇奥来(歌尔奥来, LM3027 0.74mm/30°(D)/<4.3g/眼盒15x10mm, 12吋产线+歌尔舜宇背书, 眼盒偏大抢鼻梁区空间) / B 瑞声xDispelix (0.7mm/25°/4.7g/出瞳4mm/出瞳距18mm/60x41mm/透过率90%,
    公开参数最全, 结构最友好, 但双主体流程长) / C JBD 刻蚀波导 (Pavo Lite 是唯一公开的整机开发套件, 但只供波导不供光引擎, 耦合责任在我们)。★我的建议 = 按 B 的公开几何做镜框参数化占位
    (卡槽+可换压框), A 或 C 到货只重做压框。★★但要连 FOV 目标一起拍: 公开波导只有 20-30°(D), 我们 D3 口径要 120° 对角, 差一个量级 ⇒ 老板要选 是降 FOV
    目标迁就现成波导 还是 接受定制/更贵的波导。★在 FOV 没定前, 占位件按 FOV 可变设计 (耦入/耦出角可调), 否则重演 11-02 方案变了全部重算。'

  value: 1.6mm
  note: '沉板深度四档(0.8/1.0/1.6/2.10mm)选型建议: 1.0档太浅法兰会凸出面板0.5mm; 2.10档太深会顶到腔内件; 1.6档可完全沉进>=1.5mm承力壁且座体法兰落在承力台阶上;
    各档A/B/C尺寸[0数据]需厂商图确认 (CHARGE_BOARD_SPEC M-7 指派结构总工, 本单已答)'
  ref: MECH/HW_CROSS_REVIEW.md §3.3
- key: chg_board_dissipation
  value: 0.45-0.57W
  note: P10拓扑是开关型buck(网表有SW/L_CHG/C_BST/PMID)故耗散=Pin-Pout+DCR; MECH_BUDGET §2.1的0.8W是线性稳压器公式(5-4.2)xI;
    端件表面温升口径随之改为83-108C; 打印件k=0.2 W/mK沿臂70mm导热阻约1944 K/W => 必须有金属导热路径
  ref: MECH/HW_CROSS_REVIEW.md §3.3/§5 R-4/§6 自-4/自-7
- key: ichg_iin_ratio
  value: '1.216'
  note: buck功率守恒 Pout=eta*Pin => ICHG=eta*Vbus*IIN/Vbat = 0.9*5/3.7 = 1.216 (CHARGE_BOARD_SPEC §3.4写的0.822是倒数,
    方向反了); 若真值1.216则390欧档实际ICHG是表值0.67-0.82A的约1.48倍, 单pin 0.50-0.61A超0.5A额定 => 390欧档判据要重算; 需hw-lead用datasheet原文确认
  ref: MECH/HW_CROSS_REVIEW.md §5 R-9/§6 自-3
- key: chg_board_area_util
  value: 71%
  note: 充电板25x10mm=250mm2, 器件land约179mm2 (Type-C沉板座66.6+J_CHG座41.6+BQ25896 9+电感16+电容16+电阻15+ESD/TVS/TP
    10+充电灯4.5) => 余71mm2给走线与爬电, 双面贴才够, 单面贴装不下
  ref: MECH/HW_CROSS_REVIEW.md §3.1
- key: frame_endpiece_service
  value: 可逆拆
  note: '镜框端件必须可逆拆: 框侧4条FPC固定段(>=8mm直线+>=5mm应力释放=13mm)必须在端件封盖前完成 => 端件不能是打印一体的死件; 且充电板应做成独立可抽出小盒(拆它不碰波导±0.3度与分光件5um基准)'
  ref: MECH/HW_CROSS_REVIEW.md §4.2
- key: print_pack_typec_location
  value: 镜框端件
  note: Type-C面板与充电板已按ISS-014决策5挪到镜框 => 打印包 MECH/print/temple_cage_340.stl 的Type-C试样(Y120-123)挂错件, 镜脚侧Type-C特征应删除、试样移到镜框端件件
    (待项目总工授权改版)
  ref: MECH/HW_CROSS_REVIEW.md §5 R-8/§6 自-5
open_questions:
- id: MECH-Q1
  to: main
  text: 675mAh 形态否决的兜底方案 (拆左右镜脚分摊电池) 是否走? 还是靠 Q4 口径把电池压下来
risks:
- id: R-mech-heat
  text: 持续满载 1.22W 与'眼镜贴皮肤佩戴'热学上不相容 (差 6-8 倍)。出路是降功耗不是加散热片
  severity: high
- id: R-mech-thickness
  text: '电池容量直接决定镜腿厚度: 340→7.3mm / 575→8.7mm / 675→11.2mm (华为 6.25mm 的 1.8 倍, 形态否决)'
  severity: high
- id: R-mech-splitter
  text: 'R13 分光件自研: 必须与光机共基准 (0.25°→40mm 臂长 0.175mm), 分光面需 ≤5µm 而 FDM 是 Ra 10-30µm → Plan B 双光机在结构上比一拖二更简单'
  severity: high
- id: R-mech-chargeboard
  text: 充电板只 0.2cc 但吃 25mm 长度, 是镜脚长度超标唯一元凶 → 必须挪出镜脚
  severity: medium

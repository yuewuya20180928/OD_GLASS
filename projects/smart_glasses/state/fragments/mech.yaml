- key: iss213_mech_endpoint_thermal_path_metal
  to: main
  item: '★ISS-213: 端件 (镜框) 的**散热路径**必须有金属件 —— 这不是「最好有」, 是**唯一可行解**。算式: 打印件 PA6-CF k=0.2 W/m·K, 沿臂长 70mm、截面
    180mm² ⇒ **R = 0.070/(0.2×1.8e-4) ≈ 1944 K/W** ⇒ 0.5W 打进去 **+972 K** (端件瞬间汽化); 铝 6063 (k=237) 同几何
    ⇒ **R = 1.64 K/W** ⇒ **+0.82 K** ⇒ 差 **1185×**。⇒ **端件必须设金属导热路径 (铝屏蔽罩 → 金属骨架/桥)**; 端件外表面温升按 buck 口径
    0.45–0.57W ⇒ ΔT 83K ⇒ **108°C** ⇒ 对 60°C 判据 ⇒ **P_max = 0.21W** ⇒ 现值超 **2.4–2.7×** ⇒ 没有金属热路就必然超温。★验收办法
    (B1 批加测项): 端件表面最热点 (充电板正上方) 充电 1A 稳态 30min 实测 **≤ 60°C**; 无金属热路的打印件版本直接判不合格。★**阻塞**: 镜框端件截面 **u8 未定义**
    ⇒ 端件形状/尺寸定不下来 (已有 need `iss089_frame_section_u8_block`) ⇒ ★**本单不替项目总工定端件截面**, 只把判据与验收办法摆出来。★老板已拍「边戴边充不允许」⇒
    充电时眼镜不戴 ⇒ 43°C 皮肤红线不适用, 但端件表面仍要过 60°C (烫手)。[推算]'
  since: '2026-11-15'

- key: iss192_mech_scripts_dead_constants_disposition
  to: main
  item: '★★本域 MECH 脚本的 12/15mm 死常量已全部定性处理 (ISS-192 §2/§E), 有两件事需要你/项目总工裁:


    ★(1) `MECH/fit_check.py` (M-FIT v2) **已标作废, 但文件保留** —— 定性理由: 它的整套基线 (板宽 **12** / 板长 **50** / 4 层 **0.80**)
    一起死 (板宽 12→30 是老板 10-29 19:16 拍板 + §0 台账 11-01 20:5x 订正; 板长 50→60 是 10-28 项目总工裁; 4 层 0.80→6 层 1.00
    是 hw-lead `proto_pcb_thickness_tier`)。**只把 `pcb_w` 12→30 改掉 = 造出「板宽30 + 板长50 + 厚0.80」的半迁移 Frankenstein
    口径**, 比留着 12 更危险 (它看起来像现行口径, 其实是拼的) ⇒ 本单的做法是: 文件头写定性 + **运行期 stdout 顶部直接打横幅**「基线已作废, 现行版跑 `MECH/fit_check_v3_30mm.py`」,
    **数字一个不动** (v2 的结论是 ISS-017/ISS-042 的历史闭环记录, 别人引用「fit_check.py §3① 叠放模型已判死」时仍要能复现)。

    ★**要你裁的是**: `MECH/fit_check.py` 与 `MECH/fit_check_v3_30mm.py` **长期并存还是退役 v2**? 本域的倾向是**并存 + v2 打作废横幅**
    (历史可复现 > 文件干净), 但如果项目侧要「一份脚本一个口径」, 请给一句话, 我就把它移进 `MECH/_archive/` 并同步所有引用它的地方 (现引用点: `MECH/iss065_check.py`
    的 D-4/D-6 条目、`MECH/PCB_MOUNT_PIN_SET2.md`、`MECH/BOARD_WIDTH_15MM.md`)。

    ★**引用纪律 (从本单起)**: 问「现行板装不装得下」⇒ 一律引 `MECH/fit_check_v3_30mm.py`; 引「历史闭环结论」⇒ 才引 v2 且必须带 "v2/12mm 口径"
    标注。


    ★(2) ★**30mm 板宽下金属骨架重量全线超支** —— 这是板宽翻倍带出来的新账, 需要预算裁: `MECH/skeleton_section_check.py` 迁到 30mm/RK3576
    后, 4 个候选**全部**超 `MECH_BUDGET` §2.4 B 的「+1~3g/对」骨架预算 (最好候选 = 台阶形 t=0.8 **4.08g/对**, 超 1.08g; 15mm 板时代同一候选是
    2.89g/对, 落进预算)。根因: SoC 段满宽 15.00→**30.00mm** 且满宽段长 10.00→**17.20mm** ⇒ 该段体积 ×3.08。另外**石墨片**也翻倍: 60×30×0.30
    = 1.08g/片 = **2.16g/对** > W11「1~2g/对」上限 0.16g。

    ★**结构侧建议的三个选项 (不拍板, 请裁)**: ① 满宽段只做到 SoC 投影 (X 15.00–32.20) 而不是整条; ② 横向扩散改由**石墨**承担 (石墨面内导热远好于铝), 金属骨架只做定位/局部;
    ③ 骨架材料分段 (铝骨架 + 局部铜)。

    ★复现: `python3 MECH/skeleton_section_check.py` (rc=0, 判定段 §2/§3 的候选表 + 全部候选超预算条目)。


    ★权威几何口径: `MECH/BOARD_GEOM_30MM.md` (板 60×30 / RK3576 17.20×16.10 / 逃线带 X[14.20,33.00]×Y[6.15,23.85]
    / PIN-SET-2 套 A / 影响面)。★边界: 本单**没碰 HW/ 任何文件**。'

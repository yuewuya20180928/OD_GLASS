  item: '★ISS-127 闭环的架构裁 (本单已把几何算完, 只差这一刀): 镜腿壳体改 **H 向分型 = 皮肤盖 + 内胆** 是否接受? 依据: 脱模斜度只吃垂直于拉出方向的截面, 现状
    P=V (主腔深 38.00) ⇒ H 链被吃 Δ=2·38·tanα=1.327 ⇒ 电芯段链量产最坏 -0.577 (α=1.0°) / +0.087 (0.5°) / -1.240 (1.5°);
    而判据要求 Δ≤0.35 ⇒ 等效腔深 h_max=20.05/10.03/6.68mm, **电芯自身高 23.50 ⇒ V 向脱模在任何 α 下都无解** ⇒ 唯一杠杆是换拉出方向: **P=H
    ⇒ H 链 Δ=0** (P=L 更差 1.414; V 向分型只在 0.5° 勉强)。P1 代价: 零件 24→26 件, 模具 2 套/侧 (内胆是 H 向浅腔件, 抽芯行程仅 5.70 ⇒
    比现状 38 深 V 腔更好脱模), 外观多一条分型线 (贴肤面可做到零斜度), 皮肤盖 0.8mm×130mm 需加强筋 +0.15~0.25g/对。收益: 链① 三档 α 全部过 0.40 (0.750;
    计盖自身 0.736/0.722/0.708) + 链② 四档全过 + **重量净减 0.38 g/对**。备选 P2 = 局部 H 向分型 (只在电芯段开盖, 改动面最小) 但链② 在 光面1.5°+含石墨+t=1.22
    ⇒ 0.190 破线。我的假设: 按 **P1** 推进; 若要改动面最小走 P2 并同时接受该破线。详见 MECH/ISS127_H_CHAIN_SOLUTION.md §C + MECH/iss127_h_chain_check.py

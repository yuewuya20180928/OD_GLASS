- key: iss134_sw_blue_drive_ratio_cap
  to: sw-lead
  since: '2026-11-15'
  item: '★ISS-134 给 SW 侧的一条硬约束 (光生物安全): 面板蓝光通道辐亮度占白场辐亮度上限 25% (保守), 名义值 8.26% (DCI-P3 蓝基色 x=0.150 y=0.060
    的 Y_B=0.0798 / 红 0.3850 / 绿 0.5017, 等辐射功率下算)。★为什么与 SW 有关: 光生物安全的输入量是 出瞳白场辐亮度 的**最大值**, 而亮度控制策略 (蓝光主通道占空/码值上限)
    直接决定这个最大值落在哪。★越限的后果: L_eye > 1500 cd/m2 就掉出 IEC 62471 Exempt(RG0) 进 RG1 (L_B 100..10000 W/(m2*sr)),
    需要用户信息/标签说明 (不是禁视警示, 那个要到 RG2 才有)。★判定与测量在 MECH/DISPLAY_BIOSAFETY_CRITERIA_V2.md 3.2 与 3.6; SW 侧只需保证亮度控制策略里有这条上限,
    并在亮度 API 上留一个可标定的蓝通道占比量。'

    <395 mW at 120 FPS Full Resolution, 典型值栏; Table 16 p.18 分轨工作电流 Typ 求和 372.6 mW / Max 646.4 mW, 两处互为佐证;
    datasheet 无 60fps 电流行 ⇒ 取 120fps 行为上界, 中值 ~300mW 标推算) => 换料触发条件不成立, AR0234CS 保留。U2 查到 (Table 14 p.17:
    VSUPPLY All Supplies 4.5V, 但 VIN DC Input Voltage = VDD_IO+0.3 = 3.1V => 3.3V I2C 上拉超绝对最大额定值 0.2V,
    改上拉 2.8V, 0 颗新器件, 只改 R_PU_I2CA 顶网到 RAIL_SENSOR_VDD_IO)。U3 部分查到 (Table 1 p.1: CRA = 0 度或 28 度, 是两个
    PN 变体不是同一料两档; Figure 19 p.23 给 28 度变体完整 CRA-vs-像高表, 角落 27.97 度 @ 3.396mm 对角半长; AND9658-D 存在但正文在 Scribd
    付费墙后, 推荐镜头清单与 CRA 容差带判查不到, 按老板规矩永久放弃该文档不追)。U4 查到 (Table 5 p.8-9 引脚表: VAA/VAA_PIX/VAA_PHY 三条 2.8V 模拟轨
    + VDDIO_PHY 1.8V only (Note 10 明写) + VDD/VDD_PHY/VDD_DATA 1.2V + VDD_IO 1.8/2.8V; Note 19 并轨表; Table
    22/23 上电断电时序)。★★顺带查出 4 个投板后必改的问题: ①I2C 地址写错 0x36 应为 0x10 (datasheet p.11 写明默认 0x20/0x21 即 7-bit 0x10,
    拉高 SADDR 选 0x30/0x31 即 0x18) ②I2C 上拉 3.3V 超 VIN 绝对最大额定值 ③网表缺 VDDIO_PHY 1.8V 轨且 CONN_CAM 18p 已 18/18
    占满加不出第 4 条轨 (三方案 A 20p连接器/B 铰链侧本地LDO/C VDD_IO改1.8V但会打断TMP117, D 并轨已被官方数据排除) ④netlist SENSOR_VDD_IO
    在 pin16 的 value 字段残留 1.8V。★★另: 0.92W 是 e-CAM 模组级含板载 ISP, 本项目 ISP 在 RK3572, 故 POWER_BUDGET_V3 拒绝 AR0234CS
    的那条否决理由口径不成立, 已登记 PM 复算。'

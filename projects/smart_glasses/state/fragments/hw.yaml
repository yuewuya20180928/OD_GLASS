  summary: 'ISS-067 交卷 (R-F1 3.3V 轨拓扑裁决落地): 产出 HW/POWER_TOPOLOGY_RF1_3V3V_UVP.md + HW/calc_rf1_3v3v_uvp.py
    + HANDOFF/2026-10-29_hw-lead_ISS067_RF1_3V3V_UVP.md (B1-B6 六块齐全)。核心结论: (1) 方案A (UVP 3.5V + 3.3V 由
    TPS62130A buck 供) 的真实代价≈0, 不是裁决说的牺牲12-15%容量 —— 那12-15%在现状里本来就用不到 (TPS7A20 dropout 110mV typ -> 3.3V轨在SYS<3.41V已失效),
    方案A只多切3.41->3.50V窄带(标称3%=12.6mAh); (2) 口径A续航 (420mAh电芯, 满载无桥中位0.82W): 现状1.195h(末段突然黑屏) -> 方案A 1.241h(+3.9%)
    -> 方案A''(UVP3.35V) 1.325h(+10.9%) -> buck-boost 1.475h(+23.4%); (3) 口径B选电芯: 方案A需408mAh -> 420mAh刚好够(余3%);
    满载上界1.01W需492mAh/有桥中位需496mAh -> 420不够, 下一档650mAh/8.5mm = 镜腿~10-11mm 形态否决 => ''持续满载1h'' 现在有第二条独立否决理由(电芯档位),
    与热学否决同向; (4) 镜腿7.3mm锁死值不变(电芯仍丰江432243 4.3mm, 加第3颗DC-DC不新增高度等级), 真正落地的是按需触发口径(141mAh需求, 余199%); (5)
    温度: LDO->buck 把镜腿内损耗175mW->100mW = 相对现状皮肤侧-2.94~-3.76C(改善), 但现论文热模型从未计入3.3V轨转换损耗 => 方案A落地后要补+100mW
    => 皮肤侧46.5C->50.4-51.5C, 43C红线缺口从3.5C扩到7.4-8.5C; (6) 第三条路逐条评估: buck-boost只比方案A''多+11.4分钟却多1颗新IC+~35mm2+新料量产风险+新EMI/FIT项(且4开关效率在boost段更低85-90%
    vs buck 88-93%) -> 不进第一台样机; 低dropout LDO被方案A''完全支配(只多2-4%容量却要换料); IO轨直吃SYS否决(SYS满电4.2V超典型3.3V IO绝对最大值~3.6V,
    且SoC IO/光机容差均[0数据]); ★(7) 最硬的实现风险: 裁决原文''把BQ2970的UVP阈值抬到3.5V''在器件层面没有落点 —— BQ2970是1S电芯级保护(OVP 4.275V[官方],
    UV门限[0数据])抬不到3.5V, 系统级欠压关断必须落在负载开关U_PWR_SW的输入欠压门限(>=3.35V)或外挂电压监控器, 而U_PWR_SW还在[待选型] => 现在加选型判据零板费,
    投板后加=2-4周返工; (8) 连带UX后果: UVP 3.35V + 充电板VSYS=NC => 电池没电时插USB开不了机, 待老板裁决。已登记11条interface_claims + 9条未决项(其中3条waiting_on=boss/vendor/jbd)
    + 3份artifact; 边界: 未发任何邮件/未联系供应商/未改MECH与SW与PROJECT_TRACKER/未改别人分片; merge rc=0 + gate Q1 18/18'

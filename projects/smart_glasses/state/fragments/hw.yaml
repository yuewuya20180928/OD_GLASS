  value: 0.4mm
  note: '>=0.4 常规4-6层可行 / 0.35 极限需PCB厂书面确认 / <=0.3 须HDI=一票否决; 是 SoC 选型条款不是工艺细节'
  ref: HW/HARDWARE_BREAKDOWN.md#2-卡点B
- key: mipi_diff_impedance
  value: 100Ω±10%
  note: 每 lane 差分, 等长匹配; 需 AC 耦合电容 + 1.2V/1.8V 电平对齐, 不能直连
  ref: HW/HARDWARE_BREAKDOWN.md#1.3(HW-10)
- key: dc_dc_overshoot
  value: 1.5x峰值
  note: 核心轨 DC-DC 额定>=均值x1.5, 且负载跃变响应须写进选型条款 (静态达标≠动态达标); sw-lead 已确认 OD=连续推理100%占空比无空闲窗口 -> 按连续满载设计,
    不按平均功耗x占空比
  ref: HW/HARDWARE_BREAKDOWN.md#2-结论C-2
- key: battery_charge_current
  value: 550mA@5V/2A
  note: 460mAh 1h 充满需>=550mA, 超 USB2.0 默认500mA -> 建议上 PD sink (5V only, 2A)
  ref: HW/HARDWARE_BREAKDOWN.md#2-结论C-4

  value: 'EMC 需要的 4 项硬件数据: ① **充电状态读取 = 已有, 双通路** CHG_STAT (BQ25896 STAT 开漏 +10k 上拉 → J_CHG pin5 → SoC
    GPIO, 低=充电中) + VBUS_DET (1M+1M 分压+100nF → J_CHG pin7 → SoC ADC) ⇒ M-CHRG 门禁**硬件上可实现** (ISS-043 可关)。②
    **电源域标称电压**: SYS 3.0-4.2V / 3.3V 轨 (LIGHT_3V3 150mA + VDD_3V3_IO 200mA) / 1.8V IO / 2.8V SENSOR_AVDD
    / 1.8V SENSOR_VDD_IO / 1.2V SENSOR_CORE / V_CORE 0.65-1.0V —— ★但 **11-01 基线换 RK3576 后全部作废**, 随换芯重出。③
    **帧同步信号能引出**: 现在没有独立帧同步脚 (走 MIPI CSI 内的 FS/EL 或走 USB 侧事件), 需要引出的话要加 pin ⇒ 换芯时一并定。④ **测流点**: TP_BAT_CHG
    (跨铰链压降) / TP_VBUS / TP_CHG_STAT / TP_USB_D_P/N 已有; **贴片测温点位** U_TEMP (TMP117) 有器件、缺物理测点 note ⇒ 已列
    needs。'
  ref: HW/CHARGE_STATUS_READBACK.md + HW/netlist_v1.csv (P7 测试点页)
- key: rk3572_official_datasheet
  to: main
  value: ISP要求侧124.4MP/s@60;官方上限[待核]
  ref: HW/IMX415_DEMO_SENSOR_FACTS.md §2.1 + HW/AR0234CS_OPEN_SOURCE_FACTS.md §1.1
  value_note: '★部分答复: 要求侧钉死 —— demo 走 1080p60 ⇒ ISP 进线 1920x1080@60 = 124.4MP/s; 全分辨率 3840x2160@60 = 497.7MP/s
    (超本项目 250MP/s 口径)。★**仍缺瑞芯微官方 ISP 吞吐上限 (MP/s @ 位深/并发路数)** —— 现在的 250 是媒体/模组厂口径不是官方数字, 请在官方 Brief Datasheet
    到货时一并取。另: ★顺带把 U2 (AR0234CS VDD_IO abs max = VDD_IO+0.3 = 3.1V ⇒ I2C 上拉定案 2.8V) 与 U4 (3 条独立模拟轨 + Note
    19/21 并轨表) 两条硬件数据查实了, 见 HW/AR0234CS_OPEN_SOURCE_FACTS.md。'
- key: iss148_ar0234cs_u1_u4_closed_by_open_source
  to: null
  value: 'ISS-148: AR0234CS 的 4 个未知量 U1/U2/U3/U4 已全部用公开渠道查完 (未发邮件/未联系代理/未发帖问厂家), 交卷 HW/AR0234CS_OPEN_SOURCE_FACTS.md。U1
    裸片功耗: datasheet Table 1 p.1 抬头 <395 mW @120 FPS Full Resolution, Table 16 p.18 分轨 Typ 求和 372.6 mW
    / Max 646.4 mW, 两处互证; datasheet 无 60fps 电流行, 取 120fps 行为上界, 60fps 精确值待 EVT 实测 => 换料触发条件不成立, AR0234CS
    保留。U2 VDD_IO abs max: Table 14 p.17 统一 VSUPPLY 4.5V, 但 VIN DC Input = VDD_IO+0.3 = 3.1V => 3.3V I2C
    上拉违规, 改 2.8V (0 颗新器件, 只改 R_PU_I2CA 顶网到 RAIL_SENSOR_VDD_IO)。U3 CRA: Table 1 p.1 = 0 度或 28 度两个 PN 变体,
    Figure 19 p.23 给 28 度变体完整曲线 (角落 27.97 度); AND9658-D 正文在付费墙后判查不到并按规矩永久放弃 => 120 度只能鱼眼 + ISP 鱼眼校正, PN
    变体随镜头定。U4: Table 5 p.8-9 = 5 组供电含 VDDIO_PHY 1.8V only (Note 10), 网表缺这条轨且 CONN_CAM 18p 占满 => 已登记 needs_from
    拍板。★★另查出 4 个投板后必改: I2C 地址 0x36 应为 0x10 (datasheet p.11 + RPi 驱动 overlay 双向确认; ★20:05 复核 DT 段已由并发任务改对,
    剩 netlist row 153 注释待改) / I2C 上拉 3.3V / 缺 VDDIO_PHY 轨 / netlist pin16 value 字段残留 1.8V。★★口径修正: 0.92W
    是 e-CAM 模组级含板载 ISP, 本项目 ISP 在 RK3572, 故 POWER_BUDGET_V3 里那条拒绝 AR0234CS 的否决理由口径不成立, 请 PM 按裸片数复算。'
  ref: HW/AR0234CS_OPEN_SOURCE_FACTS.md

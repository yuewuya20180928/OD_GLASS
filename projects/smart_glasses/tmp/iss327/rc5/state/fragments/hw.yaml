  to: main
  item: '问法: S8 归零到底可达不可达? 左上布局臂跑完 unc = ? 离 0 还差几条 / 每条卡在什么上? 本单实测(2026-11-18, 沙盒单变量臂 + 同日同代码对照臂): 左上布局这一条处方单独不足以归零;
    段内 P/N 顺序翻转只从 17 降到 5 (不是 0), 剩 5 处全是 CSI 5 族在 CONN_CAM 连接器侧 (Δx=-0.50mm), 跟 R_SEL_*/TP_DSI_* 挪位零作用;
    且 unc 变少 != 板变好 (盘上 unc 最少的 best23 板自己过不了名单制闸). | 谁答: main + 老板 (依 G7 iss322_s8_rsel_lane_order 的落板)
    | 不答的后果: S8 归零仍是推算 => 板那一趟可能白做 (板 md5 变第一次但归不了零 => 还得再改一次 => 2-4 周 + ¥4-8K) | 建议默认值: 归零拆成两问 - (a)
    布局能不能归零 = 不能 (已实测); (b) 机制(成对走廊/换层绕/让路闸)+口径(A1/W-1/W-2/W-4/D_LED_G/CSI电容侧)一起上能不能归零 = 本单不判, 留给 G7 +

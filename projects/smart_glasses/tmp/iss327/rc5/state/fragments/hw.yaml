  item: '问法: S8 归零到底要不要动板框/层数? 本单实测: 不要 —— SoM 主体区 x8..76 y6..56 内 In1/In3/In5/In6/B.Cu 各只占 0.38%, J_SOM_P1..P4
    全是 F.Cu 上的 SMD(通孔 0), 且同框同层数的 best_unc23 板做到 unc 23 ⇒ 是不是把 P7 口径从「C1/C2/C3 改板 / C4 不归零」改成「同框归零」? |
    谁答: main (转老板) | 不答的后果: 沿用 ISS-308 判「现役帧上 45→0 不可达」⇒ S8 不以归零收口 ⇒ G1 开不了 ⇒ 投不了板; 或走 C4 分级放行 ⇒ 带着 11
    条「两块板都没布通」的硬骨头 (高速 8 + 非高速 3) 投板 ⇒ 投板后才发现 = 2-4 周 + ¥4-8K | 建议默认值: 「同框归零」(依据 §3-4 + §3-7 实测) ⇒ P7
    只需选板形, 不必选「改不改板」 | 建议排期: BATCH-1 开工前'

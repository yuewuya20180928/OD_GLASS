  to: main
  item: '问法: CSI 5 族 (CSI_D0_CK/D0/D1/D2/D3) 在 CONN_CAM 连接器侧的段内 P/N 顺序翻转 (Δx=-0.50mm) 能不能靠【挪 R_SEL_*/TP_DSI_*
    到左上】消掉? 本单实测: 不能 - 这 5 族的两个端点都在连接器侧 (x 79.40..87.40), 与左上目标坐标 (x 5.50..41.55) 一个都不沾 => 挪位对它们的段内序零作用

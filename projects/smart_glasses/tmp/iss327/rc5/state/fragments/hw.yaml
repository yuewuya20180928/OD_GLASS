- key: iss148_hw_i2c_pullup_3v3_to_2v8
  to: main
  item: '★ISS-148 U2 查完: I2C_A 上拉必须从 3.3V 改 2.8V, 否则违反绝对最大额定值。★onsemi AR0234CS/D Table 14 p.17 ABSOLUTE
    MAXIMUM RATINGS 里 VIN DC Input Voltage = -0.3 .. VDD_IO + 0.3 V, 我们 VDD_IO = 2.8V => I2C 引脚上直流电压上限
    3.1V, 而现网表 R_PU_I2CA_SCL/SDA 顶网是 RAIL_VDD_3V3_IO (3.3V) => 超 0.2V (不是余量偏小, 是违反绝对最大额定值)。★改法零 BOM 增量:
    顶网换成 RAIL_SENSOR_VDD_IO (2.8V, U_LDO_S28B TPS7A20-28, 与上拉电阻同在 MAIN_PCB) => 不加器件不动连接器不动跨铰链走线; 阻值保持
    4.7k (datasheet Table 6 p.13 允许 1.5k..4.7k, 灌流 596uA 远小于 Table 13 的 IOL max 9 mA)。★同批要改: ①I2C 地址 0x36
    应为 0x10 (datasheet p.11 默认 0x20 写/0x21 读即 7-bit 0x10; 拉高 SADDR 选 0x30/0x31 即 0x18; Kurokesu RPi 驱动
    ar0234-overlay.dts 用 reg=<0x10> 双向确认) —— ★20:05 复核: AR0234CS_RK3572_PORT_SPEC.md 的 DT 段已由并发任务改对 (reg
    = <0x10>), 剩 netlist_v1.csv row 153 的 note 仍写 与 sensor 0x36 不冲突 这句要改; 本单再从 datasheet 原文侧独立确认一次 ②SADDR
    (A5) 必须明确接法否则地址不定驱动枚举不到 ③RSVD (F10) 必须 1.5k 接 DGND ④CAP_1UF_PHY (F12) 要 1uF 旁路 (不是 10uF 体电容) ⑤TEST
    (F5) 接 DGND, Reserved A11/B9 不接。★降上拉后风险方向反转: 现在要核的是从设备能否把 2.8V 认成高电平 (VIH), 已列清单 TMP117/桥接/充电IC/光机/RK3572
    五项, 后两项要先确认是否真在 I2C_A 上 (光机看着在 I2C_B, 充电IC 看着本板自闭环) (due 11-03)。'

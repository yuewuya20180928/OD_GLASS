  item: '★ISS-148 U2 的收尾依赖这一条, 请 sw-lead 配合核 RK3572 的 IO domain。★onsemi AR0234CS/D Table 14 p.17 给出 VIN
    DC Input Voltage 上限 = VDD_IO + 0.3 V, 我们 VDD_IO = 2.8V => sensor 侧 I2C 引脚只能承受 3.1V => I2C_A 上拉从 3.3V
    改 2.8V (已登记 need iss148_hw_i2c_pullup_3v3_to_2v8)。★但 SoC 侧还没核: I2C0_SCL = GPIO0_B0 (球 1K21) / I2C0_SDA
    = GPIO0_B1 (球 U32), 而本地 HW/RK3572_PIN_TABLE/rk3572_datasheet_V1.1.txt 的 abs-max 表把 VCCIO1_VCC 归在 1.8V
    only GPIO supply voltage 一栏 (max 1.98 V), 且引脚表里 GPIO0 组紧跟 VCCIO1_VCC 出现 => 若属实, SoC 侧 GPIO0 只允许 1.98V,
    那 3.3V 与 2.8V 上拉都超 SoC 侧 abs-max, 整条 I2C_A 电平域要重新设计 (整条降 1.8V 或加电平转换), 不是只改上拉。★本地 txt 是 pdftotext
    转出的扁平引脚表, 没有 bank 对照 GPIO 的权威表, 只能靠引脚表顺序推断, 不能当结论。★请核 Rockchip 官方 RK3572 IO domain / VCCIO 分组表, 或
    BSP rk3572.dtsi 的 io-domains / pinctrl rockchip,pins 里的 VCCIO 网名 => 这条不核, U2 最终改法不能定稿 (due 11-03)。'

  item: '★ISS-148 U4 查完发现板级硬伤, 需要跨专业拍板。★onsemi AR0234CS/D datasheet Table 5 p.8-9 + Note 10 + Note 19
    + Table 13 p.16 + Table 22 p.20 给出 5 组供电: VAA+VAA_PIX+VAA_PHY (2.8V, 可并成一条) / VDD_IO (1.8 或 2.8V)
    / VDDIO_PHY (1.8V only, Note 10 明写 should be connected to 1.8 V only) / VDD+VDD_PHY+VDD_DATA (1.2V,
    可并成一条) + 上电时序 VAA族->VDDIO->VDDIO_PHY->VDD族 (各 0-100ms)。★现状: HW/netlist_v1.csv 只有 3 条 sensor 轨 (SENSOR_CORE
    1.2V / SENSOR_AVDD 2.8V / SENSOR_VDD_IO 2.8V), 缺 VDDIO_PHY 1.8V 一条; 且跨铰链连接器 CONN_CAM 18p 已 18/18 占满
    (pin1-12 CSI+MCLK+RESET, pin13/14 I2C_A, pin15/16/17 三条 sensor 轨, pin18 GND) => 加不出第 4 条轨。★VDDIO_PHY
    不供电的后果: MIPI PHY 的 I/O 不工作, sensor 直接不出图 => 不补这条轨板子直接废。★三方案供拍板: A 跨铰链连接器 18p->20p (最干净, 但动机械最脆的铰链
    FPC + 三方协同 + 重投板风险) / B 铰链侧 camera 板本地生成 1.8V (零连接器改动, 加一颗 TPS7A20-18 X2SON 与板上其它 LDO 同封装换料不换板, 代价是
    camera 板可用供电轨要 mech-lead 确认) / C VDD_IO 也改 1.8V 让两者并成一条 (零新增, 但整条 I2C_A 必须降到 1.8V, TMP117 现供电 3.3V
    认不了 1.8V 高电平, 影响面反而更大) / D 并到 VDD_IO 2.8V 已被官方 Note 10 + Table 13 明确排除不用再讨论。★hw-lead 倾向 B, 但前提是 camera
    板上有什么轨可用还没查 (已另登记给 mech-lead)。★同时要定 sensor 轨上电时序怎么实现 (RC 延时 or SoC GPIO 拉 TPS7A20 的 EN 脚)。★本单未改 netlist_v1.csv

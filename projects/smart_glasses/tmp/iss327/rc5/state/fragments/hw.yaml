- key: iss325_s8_tp_pin_noop_proven
  to: main
  item: '问法: 显式钉那 10 个 TP_DSI_* 到底有没有用? 本单实测(2026-11-18, 两条臂同一天同一份生成器 sha256 fe131779e12cf3c6 / 同一份路由器
    sha256 5a5ce4b4cdd94155 / 同一个预留串 md5 1950683f8f2981eb6e1141c3559c02a6): ★答案是【没用 —— 是个 no-op】★ ⇒ 左上臂
    (钉 20 个) 与同日对照臂 (只钉 10 个 R_SEL_*) 的【全板 185 个封装落位逐个完全相同 (差异行数 = 0)】+ 【链终板几何完全等价 (走线 3544 / 过孔 505 /
    铜皮 4 区, 逐条相同)】+ 【unc 网名集合完全相同 (裸板 31 == 31, 链终 27 == 27, 差集两边都为空)】+ 【段内 P/N 翻转都是 5 / 47】; 根因 = state/gen_pcb_netlist_board.py
    L1042~L1060 的『测试点 TP_* 贴着它的伙伴件放』规则 ⇒ 只要 R_SEL_* 钉到左上, TP_DSI_* 自动跟过去. | 谁答: main + 老板 (★依 G7 iss322_s8_rsel_lane_order
    的落板★) | 不答的后果: ① ISS-265 / LAYOUT_FIX_SPEC §1.2 那句『只钉 R_SEL 的另一半 = 给路由器埋雷』对今天的生成器【是错的】(TP 会自动跟过去,
    不需要显式钉) ⇒ 按它开工 = 白钉 10 个坐标; ② 更要紧: 本单【这两条臂没有构成对照】(唯一变量在落位上完全没生效) ⇒ ⇒ 『左上臂 29 条 vs 现役 45 条』这个差【不能当成『左上布局的功劳』】——
    那是【左上臂 vs 现役板】的差, 里面混了别的变量 ⇒ ⇒ G7 拿它拍板会拍错; ③ 后果量级: 板 md5 多变一次 = 2-4 周 + ¥4-8K | 建议默认值: 改写处方 —— 『21
    器件左上』在今天的生成器上【等价于】『10 个 R_SEL_* 钉左上』(TP 自动跟) ⇒ 作业包里只钉 10 个 R_SEL_* 即可, 但【必须同时钉 TP_DSI_D0_N = 41.55,3.00】(它唯一在
    y=3.00, 不能跟伙伴件) | 建议排期: BATCH-1 开工前 ★(本 need key 已按 ISS-325 cont2 任务书 §③-5 逐字对齐★)'

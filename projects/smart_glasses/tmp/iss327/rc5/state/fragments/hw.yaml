- key: iss297_tmp_quota_preflight_tmpdir_mitigation_and_hardening
  to: main
  item: '★交卷单 ⑳ 节的【板那一趟开工前置】, 请 main 写进「板只改一次」那一趟的作业包 (★与同单另一实例已登记的 iss297_tmp_quota_exhausted_sandbox_selftest_false_red
    互补·不重复★)★ —— 现象: 06:0x 本机实跑, 6 道 HW 闸里有 2 道 --selftest 回 rc=1 (g1a7 / commit_order), Traceback 原文
    OSError [Errno 122] Disk quota exceeded ⇒ 根因 = /tmp 这个 tmpfs 的【用户配额】到顶 (findmnt /tmp 实测 usrquota;
    dd 探针实测 Disk quota exceeded) ⇒ ★★df 是错的仪表: 故障时 df 显示 80% · 剩 1.5G 看着还有空间, 但配额先到顶 ⇒ 用 df 预检会漏判★★ ⇒
    ★★★ 建议 (仅供参考, 不是决定, 请 main 拍): ① 板那一趟开工前先清本用户在 /tmp 的残留, 预检看 du -sm /tmp/* | sort -rn | head (别只看
    df); ② 跑 9 道闸的 --selftest 时把沙盒 TMPDIR 指到大盘 (同单另一实例已实测: 换 TMPDIR 后 7 个 --selftest 全 rc=0 · 通道 60/60);
    ③ 现场口令: 6 道闸一起红时先判是不是 /tmp 配额, 再判板是不是真被改了 — 顺序反了就会有人去改板凑绿; 反过来, 板真被改了而这 6 道还绿, 那才是通道失效要立刻报 main ⇒
    ★代价: 作业包多一条前置 + 跑闸命令加一个 TMPDIR 前缀; 我们这边不用改任何代码 (6 道闸都把 run_cases 包在 try/finally rmtree 里 ⇒ 配额爆时整批中止但沙盒不残留
    ⇒ 配额一放开就自愈)★ ⇒ ★另建议 main 单开一单做一处硬化: HW/board_reboard.py 的 build_sandbox() 现在在 run_cases() 的 try 之外
    (L679 在 L681 的 try 之前) ⇒ 配额错时整批 selftest 抛栈中止 (21 条全灭), 挪进 try + 一个 except 就能优雅退化 (★量很小★); ★但 board_reboard.py
    是 6 道闸共用的判决库, ISS-297 按任务书只读, 本单一个字节没动它★'
  since: '2026-11-18'

- key: iss325_s8_gen_products_mtime
  to: main
  item: '问法: 4 个生成器产物 (HW/PCB/STACKUP.md / LAYOUT_RULES.md / GEN_SELF_CHECK.txt / _frame_reference.kicad_pcb)
    每次跑 check_pcb_drc.py 就被重写一遍 —— 修不修? 本单实测: ★是, 无条件重写★ —— 根因链 = state/check_pcb_drc.py L156~L159 (C5
    生成器自检) 无条件 run(gen_kicad_project.py) → gen_kicad_project.py L255/L286/L303/L369 无条件 open(...,''w'').write(...)
    (无 if-not-exists / 无内容比对 / 无 mtime 守卫) ⇒ ⇒ 任何跑 check_pcb_drc.py 的动作都改这 4 个文件的 mtime ⇒ state/daily_check.py
    L321 + state/chain_gate.py L296 都跑它 ⇒ 【每天的巡检都在动这 4 个文件】. ★内容实情: 前 3 个只差首行时间戳 (diff 只报 1c1 一处) ⇒ 逐字节相同;
    _frame_reference.kicad_pcb 剥掉 236 处随机 uuid 后逐字节相同 ⇒ 几何/网络零变化 ⇒ 【不是语义改动】. ★同型缺陷已在 ISS-280 (2026-11-17
    08:50, state/_apply_20261117_0850_main_verify279_280.py L68) 被披露过一次, 至今未修 ⇒ 属【复发型缺陷】. | 谁答: main |
    不答的后果: 这 4 个文件的 mtime 每天都在动 ⇒ 任何用 mtime 做『有没有被改过』的判据【永久失效】; 且它们每次都变 ⇒ 谁想说『盘面没动』得每次重新自证一遍, 成本持续累积 |
    建议默认值: 给 gen_kicad_project.py 加【内容相同就不写】守卫 (★比对时把首行时间戳与 uuid 占位归一化★) ⇒ 一次改, 永久静默 | 建议排期: 不阻塞 BATCH-1
    (板面/网表/脚表/BOM 一个字节未动·已双证), 任意一次例行维护窗口'
  since: '2026-11-18'
- key: iss325_s8_no_valid_control
  to: main
  item: '问法: 这两条臂【没构成对照】(唯一变量在落位上完全没生效) —— 本单的实测读数还能不能用来给 G7 拍板? 本单实测: ★能, 但必须降级用法★ —— 左上臂 (钉 20) 与同日对照臂
    (钉 10) 的 unc 网名集合/几何/翻转全部相同 ⇒ ⇒ 【『左上布局』这一条处方对今天的生成器【零净效应】】(不是『效果小』, 是【零】); 而『左上臂 29 vs 现役 45』这个差【不能归因给左上布局】(对照失效
    ⇒ 混淆因子未剥离) ⇒ ⇒ 真正可用的结论只有两条: ① 左上臂/对照臂/现役板 三块板的逐条读数本身 (板 md5 + viol + unc + unc 网名 + 段数 + 翻转数 + 名单制闸三条)

                let currentWorkDir = '';
                let currentShapeId = modelData.header.default_shape_id || 0;

                // 初始化task onnx目录
                function initWorkDir() {
                    // 尝试从localStorage获取之前保存的task onnx目录
                    const savedWorkDir = localStorage.getItem('rknx_work_dir');
                    if (savedWorkDir) {
                        currentWorkDir = savedWorkDir;
                        document.getElementById('work-dir-input').value = savedWorkDir;
                    }
                    updateOnnxPathDisplay();
                }

                // 更新task onnx目录
                function updateWorkDir() {
                    const input = document.getElementById('work-dir-input');
                    const newWorkDir = input.value.trim();

                    if (newWorkDir) {
                        currentWorkDir = newWorkDir;
                        // 保存到localStorage
                        localStorage.setItem('rknx_work_dir', newWorkDir);
                        updateOnnxPathDisplay();

                        // 显示成功提示
                        showToast('工作目录已更新！', 'success');
                    } else {
                        showToast('请输入有效的工作目录路径！', 'warning');
                    }
                }

                // 重置工作目录
                function resetWorkDir() {
                    currentWorkDir = '';
                    document.getElementById('work-dir-input').value = '';
                    localStorage.removeItem('rknx_work_dir');
                    updateOnnxPathDisplay();
                    showToast('工作目录已重置！', 'info');
                }

                // 更新ONNX路径显示
                function updateOnnxPathDisplay() {
                    const pathElement = document.getElementById('current-onnx-path');
                    if (currentWorkDir) {
                        pathElement.textContent = currentWorkDir + '/' + defaultDumpDir;
                    } else {
                        pathElement.textContent = './' + defaultDumpDir + ' (当前脚本执行目录)';
                    }
                }

                // 构建ONNX文件的完整路径
                function buildOnnxFilePath(taskName) {
                    const onnxFileName = taskName + '.onnx';
                    if (currentWorkDir) {
                        return currentWorkDir + '/' + defaultDumpDir + '/' + onnxFileName;
                    } else {
                        // 使用当前脚本执行目录 + dump_dir
                        return './' + defaultDumpDir + '/' + onnxFileName;
                    }
                }

                function formatBytes(bytes) {
                    if (bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                }

                function calculateCoreConstInputSize(graph, coreId) {
                    const seenTensorNames = new Set();
                    return (graph.tensors || [])
                        .filter(tensor => tensor.category === 'const_input' && (Number(tensor.plan_core_id) || 0) === coreId)
                        .reduce((sum, tensor) => {
                            const tensorName = String(tensor.name || '');
                            const planSize = Number(tensor.plan_size) || 0;
                            if (seenTensorNames.has(tensorName)) {
                                return sum;
                            }
                            seenTensorNames.add(tensorName);
                            return sum + planSize;
                        }, 0);
                }

                function calculateCoreProfileInfoSize(graph, coreId) {
                    return (graph.tasks || [])
                        .filter(task => (Number(task.core_id) || 0) === coreId)
                        .reduce((sum, task) => {
                            const taskPrivateSize = (task.private_rknn_region || [])
                                .reduce((innerSum, region) => innerSum + (Number(region.size) || 0), 0);
                            return sum + taskPrivateSize;
                        }, 0);
                }

                function toggleTask(element) {
                    const content = element.nextElementSibling;
                    const icon = element.querySelector('.expand-icon');

                    if (content.style.display === 'block') {
                        content.style.display = 'none';
                        icon.textContent = '+';
                    } else {
                        content.style.display = 'block';
                        icon.textContent = '-';
                    }
                }

                function toggleOperator(element) {
                    const content = element.nextElementSibling;
                    const icon = element.querySelector('.operator-expand-icon');

                    if (content.style.display === 'block') {
                        content.style.display = 'none';
                        icon.textContent = '+';
                    } else {
                        content.style.display = 'block';
                        icon.textContent = '-';
                    }
                }

                // 初始化全局形状切换器

                    const header = modelData.header;
                    if (header.inference_mode === 'dynamic_bucket' && header.io_configs && header.io_configs.length > 1) {
                        const switcherHtml = header.io_configs.map(config => `
                            <button class="btn btn-sm ${config.shape_id === currentShapeId ? 'btn-primary' : 'btn-outline-secondary'} me-2 mb-2"
                                    onclick="switchGlobalShapeConfig(${config.shape_id})">
                                Shape ID ${config.shape_id}
                            </button>
                        `).join('');

                        document.getElementById('global-shape-buttons').innerHTML = switcherHtml;
                        document.getElementById('global-shape-switcher').style.display = 'block';
                    }
                }

                // 全局形状配置切换函数
                function switchGlobalShapeConfig(shapeId) {
                    currentShapeId = shapeId;

                    // 更新按钮状态
                    const buttons = document.querySelectorAll('#global-shape-buttons button');
                    buttons.forEach(btn => {
                        if (btn.textContent.includes(`Shape ID ${shapeId}`)) {
                            btn.classList.remove('btn-outline-secondary');
                            btn.classList.add('btn-primary');
                        } else {
                            btn.classList.remove('btn-primary');
                            btn.classList.add('btn-outline-secondary');
                        }
                    });

                    // 重新渲染模型信息和子模型
                    renderModelInfo();
                    renderSubModels();
                }

                function renderModelInfo() {

                function generateTaskColumns(tasks, npu_core_number, vrv_id, vrv_number) {

                        }
                        tasksByCore[task.core_id][task.id] = task;
                        allTaskIds.add(task.id);
                    });

                    // 获取所有参与的 core_id 并排序
                    const coreIds = Object.keys(tasksByCore).map(Number).sort((a, b) => a - b);

                    // 将所有 task id 排序
                    const sortedTaskIds = Array.from(allTaskIds).sort((a, b) => a - b);

                    return `

                            <!-- 添加 core id 标题行 -->

                function generateMemoryColumns(memory_allocations, npu_core_number, vrv_id, vrv_number, graph) {
                    // 计算当前VRV负责的core范围
                    const core_per_vrv = Math.ceil(npu_core_number / vrv_number);
                    const core_start = vrv_id * core_per_vrv;
                    const core_end = core_start + core_per_vrv;

                    const memoryByCore = {};
                    memory_allocations.forEach(mem => {
                        if (mem.core_index >= core_start && mem.core_index < core_end) {
                            memoryByCore[mem.core_index] = mem;
                        }
                    });

                    return Array.from({length: core_per_vrv}, (_, i) => {
                        const core_id = core_start + i;
                        const rawCommandSize = memoryByCore[core_id] ? (Number(memoryByCore[core_id].command_size) || 0) : 0;
                        const constInputSize = calculateCoreConstInputSize(graph, core_id);
                        const profileInfoSize = calculateCoreProfileInfoSize(graph, core_id);
                        const commandSize = Math.max(0, rawCommandSize - constInputSize - profileInfoSize);
                        return `
                            <div class="memory-column">
                                <div class="memory-header">
                                    <h6 class="mb-0">Core ${core_id} Memory</h6>
                                </div>
                                ${memoryByCore[core_id] ? `
                                    <div class="memory-content">
                                        <div class="memory-item">
                                            <strong>Total Size:</strong><br>
                                            ${formatBytes(memoryByCore[core_id].total_size)} (${memoryByCore[core_id].total_size} bytes)
                                        </div>
                                        <div class="memory-item">
                                            <strong>Weights:</strong><br>
                                            ${formatBytes(memoryByCore[core_id].weights_size)} (${memoryByCore[core_id].weights_size} bytes)
                                        </div>
                                        <div class="memory-item">
                                            <strong>Command Size:</strong><br>
                                            ${formatBytes(commandSize)} (${commandSize} bytes)
                                        </div>
                                        <div class="memory-item">
                                            <strong>Const Input Size:</strong><br>
                                            ${formatBytes(constInputSize)} (${constInputSize} bytes)
                                        </div>
                                        <div class="memory-item">
                                            <strong>Profile Info Size:</strong><br>
                                            ${formatBytes(profileInfoSize)} (${profileInfoSize} bytes)
                                        </div>
                                        <div class="memory-item">
                                            <strong>KVCache:</strong><br>
                                            ${formatBytes(memoryByCore[core_id].kvcache_size)} (${memoryByCore[core_id].kvcache_size} bytes)
                                        </div>
                                        <div class="memory-item">
                                            <strong>Internal:</strong><br>
                                            ${formatBytes(memoryByCore[core_id].internal_size)} (${memoryByCore[core_id].internal_size} bytes)
                                        </div>
                                    </div>
                                ` : `
                                    <div class="memory-content text-muted">
                                        No memory allocation
                                    </div>
                                `}
                            </div>
                        `;
                    }).join('');
                }

                    // 阻止事件冒泡，防止触发task展开/收缩
                    event.stopPropagation();

                    // 构建ONNX文件路径
                    const onnxFilePath = buildOnnxFilePath(taskName);

                    // 尝试多种方式打开ONNX文件
                    try {
                        // 方式1: 尝试使用Netron在线版本
                        const netronUrl = 'https://netron.app/';
                        const newWindow = window.open(netronUrl, '_blank');

                        if (newWindow) {
                            // 显示文件路径信息
                            showOnnxFileInfo(onnxFilePath, netronUrl);
                        } else {
                            // 如果弹窗被阻止，显示手动操作提示
                            showManualOnnxInstructions(onnxFilePath);
                        }
                    } catch (error) {
                        console.error('Error opening ONNX file:', error);
                        showManualOnnxInstructions(onnxFilePath);
                    }
                }

                                <div class="modal-header">
                                    <h5 class="modal-title">打开ONNX文件</h5>
                                    <button type="button" class="btn-close" onclick="closeModal(this)"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="alert alert-info">
                                        <h6>ONNX文件路径：</h6>
                                        <div class="file-path-container">
                                            <input type="text" class="form-control" value="${filePath}" readonly>
                                            <button class="btn btn-sm btn-outline-secondary ms-2" onclick="copyToClipboard('${filePath}')">
                                                <i class="fas fa-copy"></i> 复制路径
                                            </button>
                                        </div>
                                    </div>
                                    <div class="alert alert-warning">
                                        <h6>手动打开方式：</h6>
                                        <ol>
                                            <li><strong>在线版本：</strong> <a href="https://netron.app/" target="_blank">点击打开Netron在线版</a></li>
                                            <li><strong>本地版本：</strong> 如果已安装Netron，可在终端运行：<br>
                                                <code>netron "${filePath}"</code>
                                            </li>
                                            <li><strong>其他工具：</strong> 也可使用其他ONNX查看工具打开该文件</li>
                                        </ol>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" onclick="closeModal(this)">关闭</button>
                                    <button type="button" class="btn btn-primary" onclick="window.open('https://netron.app/', '_blank')">打开Netron在线版</button>
                                </div>
                            </div>
                        </div>
                    `;
                    document.body.appendChild(modal);
                }

                function copyToClipboard(text) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('路径已复制到剪贴板！', 'success');
                    }).catch(err => {
                        console.error('复制失败:', err);
                        // 降级处理：选择文本
                        const textArea = document.createElement('textarea');
                        textArea.value = text;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        showToast('路径已复制到剪贴板！', 'success');
                    });
                }

                function showToast(message, type = 'info') {
                    const toast = document.createElement('div');
                    toast.className = 'toast-notification';
                    toast.textContent = message;

                    const colorMap = {
                        'success': '#28a745',
                        'warning': '#ffc107',
                        'info': '#17a2b8',
                        'error': '#dc3545'
                    };

                    toast.style.cssText = `
                        position: fixed;
                        top: 20px;
                        right: 20px;
                        background: ${colorMap[type] || colorMap.info};
                        color: white;
                        padding: 10px 20px;
                        border-radius: 4px;
                        z-index: 9999;
                        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                        font-size: 14px;
                    `;
                    document.body.appendChild(toast);

                    setTimeout(() => {
                        if (document.body.contains(toast)) {
                            document.body.removeChild(toast);
                        }
                    }, 3000);
                }

                function closeModal(button) {
                    const modal = button.closest('.modal');
                    if (modal && document.body.contains(modal)) {
                        document.body.removeChild(modal);
                    }
                }
            </script>
        </div>
    </body>
    </html>
